  <rect x="1230" y="705" width="180" height="60" class="box infra"/>
  <text x="1320" y="735" class="text">ClickHouse</text>

  <path d="M800 480 C850 480 875 415 930 415" class="arrow"/>
  <text x="875" y="430" class="label">best route / ETA</text>
  <path d="M930 415 C880 415 850 565 800 565" class="arrow"/>
  <text x="890" y="545" class="label">positions</text>
  <path d="M930 415 C880 415 850 395 800 395" class="arrow"/>
  <text x="875" y="385" class="label">candidates</text>


  <rect x="620" y="620" width="180" height="60" class="box core"/>
  <text x="710" y="650" class="text">File Service</text>

  <rect x="620" y="705" width="180" height="60" class="box core"/>
  <text x="710" y="735" class="text">Report Service</text>

  <path d="M510 165 C550 165 560 140 620 140" class="arrow"/>
  <path d="M510 165 C550 165 560 225 620 225" class="arrow"/>
  <path d="M510 165 C550 165 560 310 620 310" class="arrow"/>
  <path d="M510 165 C550 165 560 395 620 395" class="arrow"/>
  <path d="M510 165 C550 165 560 480 620 480" class="arrow"/>
  <path d="M510 165 C550 165 560 565 620 565" class="arrow"/>
  <path d="M510 165 C550 165 560 650 620 650" class="arrow"/>
  <path d="M510 165 C550 165 560 735 620 735" class="arrow"/>
  <text x="560" y="100" class="label">gRPC</text>

  <rect x="930" y="385" width="180" height="60" class="box core"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .core { fill: #eef2ff; stroke: #3730a3; }
      .infra { fill: #ecfdf5; stroke: #047857; }
      .async { fill: #fff7ed; stroke: #c2410c; }
      .text { font-family: Arial, sans-serif; font-size: 18px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .event { stroke: #c2410c; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 5; }
    </style>
  </defs>

  <text x="800" y="40" class="text" style="font-size:28px;font-weight:700">Unified City Services Architecture</text>
  <text x="800" y="70" class="small">Solid arrows: synchronous HTTP/gRPC. Dashed arrows: Kafka events.</text>

  <rect x="50" y="130" width="190" height="70" class="box"/>
  <text x="145" y="165" class="text">Client / Frontend</text>

  <rect x="320" y="130" width="190" height="70" class="box core"/>
  <text x="415" y="165" class="text">API Gateway</text>
  <text x="280" y="122" class="label">HTTP/2 HTTPS REST/JSON</text>
  <path d="M240 165 H320" class="arrow"/>

  <rect x="620" y="110" width="180" height="60" class="box core"/>
  <text x="710" y="140" class="text">Auth Service</text>

  <rect x="620" y="195" width="180" height="60" class="box core"/>

  <rect x="620" y="280" width="180" height="60" class="box core"/>
  <text x="710" y="310" class="text">Department</text>

  <rect x="620" y="365" width="180" height="60" class="box core"/>
  <text x="710" y="395" class="text">Brigade Service</text>

  <rect x="620" y="450" width="180" height="60" class="box core"/>

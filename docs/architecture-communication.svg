  <path d="M1110 415 C1165 415 1170 230 1220 230" class="event"/>
  <path d="M800 650 C1010 650 1060 230 1220 230" class="event"/>
  <path d="M800 735 C1010 735 1060 230 1220 230" class="event"/>

  <path d="M1315 270 V330" class="event"/>
  <path d="M1315 270 V425" class="event"/>
  <path d="M1315 270 V520" class="event"/>
  <path d="M1220 230 C1160 230 1115 735 1110 735" class="event"/>
  <path d="M1410 230 C1480 230 1480 735 1410 735 H1410" class="event"/>
  <path d="M1410 230 C1490 230 1490 735 1410 735 H1410" class="event"/>

  <text x="1010" y="210" class="label">*.events.v1</text>
  <text x="1315" y="300" class="label">Kafka consumers</text>

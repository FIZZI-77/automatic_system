  <rect x="1220" y="190" width="190" height="80" class="box async"/>
  <text x="1315" y="230" class="text">Kafka</text>
  <text x="1315" y="252" class="small">domain events</text>

  <rect x="1220" y="330" width="190" height="60" class="box async"/>
  <text x="1315" y="360" class="text">SLA Service</text>

  <rect x="1220" y="425" width="190" height="60" class="box async"/>
  <text x="1315" y="455" class="text">Notification</text>

  <rect x="1220" y="520" width="190" height="60" class="box async"/>

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_ADDR: ":8080"
      AUTH_SERVICE_ADDR: "host.docker.internal:50051"
      TICKET_SERVICE_ADDR: "host.docker.internal:50052"
      DEPARTMENT_SERVICE_ADDR: "host.docker.internal:50053"
      BRIGADE_SERVICE_ADDR: "host.docker.internal:50054"
      JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      JWT_ISSUER: "auth-jwt"
      JWT_AUDIENCE: "api-gateway"
    volumes:
      - type: bind
        source: ../keys/public.pem
        target: /app/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

# Every expression below references metrics confirmed by current manifests/exporters.
# Application-specific queue/outbox metrics are omitted until instrumentation exists.
queries:
  pod_cpu: 'sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$pod"}[1m]))'
  pod_memory: 'sum(container_memory_working_set_bytes{namespace="$namespace",pod=~"$pod"})'
  pod_restarts: 'sum(kube_pod_container_status_restarts_total{namespace="$namespace",pod=~"$pod"})'
  gateway_request_rate: 'sum(rate(http_server_request_count_total{namespace="$namespace"}[1m]))'
  gateway_duration_p95: 'histogram_quantile(0.95,sum by (le)(rate(http_server_request_duration_bucket{namespace="$namespace"}[1m])))'
  kafka_consumer_lag: 'sum(kafka_consumergroup_lag) by (consumergroup,topic)'
  pgbouncer_waiting: 'sum(pgbouncer_pools_client_waiting_connections)'
  redis_ops: 'sum(rate(redis_commands_processed_total[1m]))'
  clickhouse_queries: 'sum(rate(ClickHouseProfileEvents_Query[1m]))'
unavailable_until_instrumented:
  - location_history_buffer_utilization
  - location_dropped_history_total
  - application_outbox_backlog
  - notification_delivery_queue_size
  - report_worker_queue_length

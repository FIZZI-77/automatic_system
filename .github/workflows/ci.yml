name: CI/CD

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master
      - "feature/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: automatic-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/automatic-system

jobs:

  # ===========================================================================
  # Go quality
  # ===========================================================================

  go-quality:
    name: Go quality - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: root
            directory: .

          - service: api-gateway
            directory: API_Gateway

          - service: auth
            directory: Auth_Service

          - service: profile
            directory: Profile_Service

          - service: ticket
            directory: Ticket_Service

          - service: department
            directory: Department_Service

          - service: brigade
            directory: Brigade_Service

          - service: location
            directory: Location_Service

          - service: routing
            directory: Routing_Service

          - service: dispatch
            directory: Dispatch_Service

          - service: file
            directory: File_Service

          - service: sla
            directory: SLA_Service

          - service: notification
            directory: Notification_Service

          - service: audit
            directory: Audit_Service

          - service: analytics
            directory: Analytics_Service

          - service: report
            directory: Report_Service

          - service: asset
            directory: Asset_Service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Verify dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod verify

      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        working-directory: ${{ matrix.directory }}
        run: go vet ./...

      - name: Run tests with race detector
        working-directory: ${{ matrix.directory }}
        run: go test -race ./...

  # ===========================================================================
  # Docker Compose validation
  # ===========================================================================

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config --quiet

  # ===========================================================================
  # Kubernetes validation
  # ===========================================================================

  kubernetes-validation:
    name: Validate Kubernetes - ${{ matrix.overlay }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        overlay:
          - local
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize
        run: |
          kubectl kustomize "k8s/overlays/${{ matrix.overlay }}" > rendered.yaml

      - name: Client-side validation
        run: |
          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f rendered.yaml

      - name: Check production image tags
        if: matrix.overlay == 'prod'
        shell: bash
        run: |
          if grep -E 'image: .*:(latest|dev)$' rendered.yaml; then
            echo "Mutable image tag found in production manifests"
            exit 1
          fi

  # ===========================================================================
  # Application Docker images
  # ===========================================================================

  application-images:
    name: Build application image - ${{ matrix.name }}
    runs-on: ubuntu-latest

    needs:
      - go-quality
      - compose-validation
      - kubernetes-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: .
            dockerfile: API_Gateway/Dockerfile

          - name: auth
            context: .
            dockerfile: Auth_Service/Dockerfile

          - name: profile
            context: .
            dockerfile: Profile_Service/Dockerfile

          - name: ticket
            context: .
            dockerfile: Ticket_Service/Dockerfile

          - name: department
            context: .
            dockerfile: Department_Service/Dockerfile

          - name: brigade
            context: .
            dockerfile: Brigade_Service/Dockerfile

          - name: location
            context: .
            dockerfile: Location_Service/Dockerfile

          - name: routing
            context: .
            dockerfile: Routing_Service/Dockerfile

          - name: dispatch
            context: .
            dockerfile: Dispatch_Service/Dockerfile

          - name: file
            context: .
            dockerfile: File_Service/Dockerfile

          - name: sla
            context: .
            dockerfile: SLA_Service/Dockerfile

          - name: notification
            context: .
            dockerfile: Notification_Service/Dockerfile

          - name: audit
            context: .
            dockerfile: Audit_Service/Dockerfile

          - name: analytics
            context: .
            dockerfile: Analytics_Service/Dockerfile

          - name: report
            context: .
            dockerfile: Report_Service/Dockerfile

          - name: asset
            context: .
            dockerfile: Asset_Service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ===========================================================================
  # Migrator Docker images
  # ===========================================================================

  migrator-images:
    name: Build migrator image - ${{ matrix.name }}
    runs-on: ubuntu-latest

    needs:
      - go-quality
      - compose-validation
      - kubernetes-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-migrator
            context: .
            dockerfile: Auth_Service/Dockerfile.migrator

          - name: profile-migrator
            context: .
            dockerfile: Profile_Service/Dockerfile.migrator

          - name: ticket-migrator
            context: .
            dockerfile: Ticket_Service/Dockerfile.migrator

          - name: department-migrator
            context: .
            dockerfile: Department_Service/Dockerfile.migrator

          - name: brigade-migrator
            context: .
            dockerfile: Brigade_Service/Dockerfile.migrator

          - name: location-migrator
            context: .
            dockerfile: Location_Service/Dockerfile.migrator

          - name: routing-migrator
            context: .
            dockerfile: Routing_Service/Dockerfile.migrator

          - name: dispatch-migrator
            context: .
            dockerfile: Dispatch_Service/Dockerfile.migrator

          - name: file-migrator
            context: .
            dockerfile: File_Service/Dockerfile.migrator

          - name: sla-migrator
            context: .
            dockerfile: SLA_Service/Dockerfile.migrator

          - name: notification-migrator
            context: .
            dockerfile: Notification_Service/Dockerfile.migrator

          - name: audit-migrator
            context: .
            dockerfile: Audit_Service/Dockerfile.migrator

          - name: report-migrator
            context: .
            dockerfile: Report_Service/Dockerfile.migrator

          - name: asset-migrator
            context: .
            dockerfile: Asset_Service/Dockerfile.migrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and optionally push migrator
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ===========================================================================
  # ClickHouse init image
  # ===========================================================================

  clickhouse-init-image:
    name: Build ClickHouse init image
    runs-on: ubuntu-latest

    needs:
      - compose-validation
      - kubernetes-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-clickhouse-init
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and optionally push ClickHouse init
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Analytics_Service/Dockerfile.clickhouse-init
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ===========================================================================
  # DEV deployment
  # ===========================================================================

  deploy-dev:
    name: Deploy feature branch to dev

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    needs:
      - application-images
      - migrator-images
      - clickhouse-init-image

    environment:
      name: development

    concurrency:
      group: automatic-system-development
      cancel-in-progress: true

    # IMPORTANT:
    # GitHub Actions does not allow secrets.* directly in step "if".
    # Therefore optional GHCR credentials are first exposed as job env values
    # and the step condition checks env.GHCR_PULL_TOKEN.
    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          test -n "$KUBECONFIG_B64"

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBECONFIG_B64" \
            | base64 --decode \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl cluster-info

      - name: Validate required deployment secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          test -n "$RUNTIME_ENV_B64"
          test -n "$JWT_PRIVATE_KEY_B64"
          test -n "$JWT_PUBLIC_KEY_B64"

          printf '%s' "$RUNTIME_ENV_B64" | base64 --decode > /tmp/runtime.env
          printf '%s' "$JWT_PRIVATE_KEY_B64" | base64 --decode > /tmp/private.pem
          printf '%s' "$JWT_PUBLIC_KEY_B64" | base64 --decode > /tmp/public.pem

          test -s /tmp/runtime.env
          test -s /tmp/private.pem
          test -s /tmp/public.pem

          rm -f /tmp/runtime.env /tmp/private.pem /tmp/public.pem

      - name: Apply dev namespace
        run: |
          kubectl apply -f k8s/base/namespace/namespace.yaml

      - name: Create runtime secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          RUNTIME_FILE="$(mktemp)"
          PRIVATE_KEY_FILE="$(mktemp)"
          PUBLIC_KEY_FILE="$(mktemp)"

          trap 'rm -f "$RUNTIME_FILE" "$PRIVATE_KEY_FILE" "$PUBLIC_KEY_FILE"' EXIT

          printf '%s' "$RUNTIME_ENV_B64" \
            | base64 --decode \
            > "$RUNTIME_FILE"

          printf '%s' "$JWT_PRIVATE_KEY_B64" \
            | base64 --decode \
            > "$PRIVATE_KEY_FILE"

          printf '%s' "$JWT_PUBLIC_KEY_B64" \
            | base64 --decode \
            > "$PUBLIC_KEY_FILE"

          kubectl create secret generic runtime-secrets \
            --namespace automatic-system-dev \
            --from-env-file="$RUNTIME_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl create secret generic jwt-private-key \
            --namespace automatic-system-dev \
            --from-file=private.pem="$PRIVATE_KEY_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl create secret generic jwt-public-key \
            --namespace automatic-system-dev \
            --from-file=public.pem="$PUBLIC_KEY_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      - name: Configure optional private GHCR pull secret
        if: ${{ env.GHCR_PULL_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret docker-registry ghcr-pull \
            --namespace automatic-system-dev \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME:-${GITHUB_ACTOR}}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl patch serviceaccount default \
            --namespace automatic-system-dev \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Set immutable image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Apply dev infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -k k8s/overlays/dev/infra

      - name: Wait for dev infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            --namespace automatic-system-dev \
            --timeout=300s

      - name: Apply dev migrations
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          kubectl delete -k k8s/overlays/dev/migrations \
            --ignore-not-found=true || true

          kubectl apply -k k8s/overlays/dev/migrations

      - name: Wait for dev migrations
        shell: bash
        run: |
          set -euo pipefail

          jobs="$(kubectl get jobs \
            --namespace automatic-system-dev \
            -o name)"

          if [ -z "$jobs" ]; then
            echo "No migration jobs found"
            exit 1
          fi

          while IFS= read -r job; do
            [ -z "$job" ] && continue

            kubectl wait \
              --for=condition=complete \
              "$job" \
              --namespace automatic-system-dev \
              --timeout=300s
          done <<< "$jobs"

      - name: Apply dev applications
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -k k8s/overlays/dev/apps

      - name: Wait for dev application rollouts
        shell: bash
        run: |
          set -euo pipefail

          deployments="$(kubectl get deployments \
            --namespace automatic-system-dev \
            -o name)"

          if [ -z "$deployments" ]; then
            echo "No deployments found"
            exit 1
          fi

          while IFS= read -r deployment; do
            [ -z "$deployment" ] && continue

            kubectl rollout status \
              "$deployment" \
              --namespace automatic-system-dev \
              --timeout=300s
          done <<< "$deployments"

  # ===========================================================================
  # PRODUCTION deployment
  # ===========================================================================

  deploy-prod:
    name: Deploy main/master to production

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    needs:
      - application-images
      - migrator-images
      - clickhouse-init-image

    environment:
      name: production

    concurrency:
      group: automatic-system-production
      cancel-in-progress: false

    # Same workaround as deploy-dev:
    # secrets are mapped to env before being used by an "if" expression.
    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          test -n "$KUBECONFIG_B64"

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBECONFIG_B64" \
            | base64 --decode \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl cluster-info

      - name: Validate required deployment secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          test -n "$RUNTIME_ENV_B64"
          test -n "$JWT_PRIVATE_KEY_B64"
          test -n "$JWT_PUBLIC_KEY_B64"

          printf '%s' "$RUNTIME_ENV_B64" | base64 --decode > /tmp/runtime.env
          printf '%s' "$JWT_PRIVATE_KEY_B64" | base64 --decode > /tmp/private.pem
          printf '%s' "$JWT_PUBLIC_KEY_B64" | base64 --decode > /tmp/public.pem

          test -s /tmp/runtime.env
          test -s /tmp/private.pem
          test -s /tmp/public.pem

          rm -f /tmp/runtime.env /tmp/private.pem /tmp/public.pem

      - name: Apply production namespace
        run: |
          kubectl apply -f k8s/base/namespace/namespace.yaml

      - name: Create production runtime secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          RUNTIME_FILE="$(mktemp)"
          PRIVATE_KEY_FILE="$(mktemp)"
          PUBLIC_KEY_FILE="$(mktemp)"

          trap 'rm -f "$RUNTIME_FILE" "$PRIVATE_KEY_FILE" "$PUBLIC_KEY_FILE"' EXIT

          printf '%s' "$RUNTIME_ENV_B64" \
            | base64 --decode \
            > "$RUNTIME_FILE"

          printf '%s' "$JWT_PRIVATE_KEY_B64" \
            | base64 --decode \
            > "$PRIVATE_KEY_FILE"

          printf '%s' "$JWT_PUBLIC_KEY_B64" \
            | base64 --decode \
            > "$PUBLIC_KEY_FILE"

          kubectl create secret generic runtime-secrets \
            --namespace automatic-system \
            --from-env-file="$RUNTIME_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl create secret generic jwt-private-key \
            --namespace automatic-system \
            --from-file=private.pem="$PRIVATE_KEY_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl create secret generic jwt-public-key \
            --namespace automatic-system \
            --from-file=public.pem="$PUBLIC_KEY_FILE" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      - name: Configure optional private GHCR pull secret
        if: ${{ env.GHCR_PULL_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret docker-registry ghcr-pull \
            --namespace automatic-system \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME:-${GITHUB_ACTOR}}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

          kubectl patch serviceaccount default \
            --namespace automatic-system \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Set immutable production image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Apply production infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -k k8s/overlays/prod/infra

      - name: Wait for production infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            --namespace automatic-system \
            --timeout=600s

      - name: Apply production migrations
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete -k k8s/overlays/prod/migrations \
            --ignore-not-found=true || true

          kubectl apply -k k8s/overlays/prod/migrations

      - name: Wait for production migrations
        shell: bash
        run: |
          set -euo pipefail

          jobs="$(kubectl get jobs \
            --namespace automatic-system \
            -o name)"

          if [ -z "$jobs" ]; then
            echo "No migration jobs found"
            exit 1
          fi

          while IFS= read -r job; do
            [ -z "$job" ] && continue

            kubectl wait \
              --for=condition=complete \
              "$job" \
              --namespace automatic-system \
              --timeout=600s
          done <<< "$jobs"

      - name: Apply production applications
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -k k8s/overlays/prod/apps

      - name: Apply production network policies
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "k8s/overlays/prod/network" ]; then
            kubectl apply -k k8s/overlays/prod/network
          fi

      - name: Wait for production application rollouts
        shell: bash
        run: |
          set -euo pipefail

          deployments="$(kubectl get deployments \
            --namespace automatic-system \
            -o name)"

          if [ -z "$deployments" ]; then
            echo "No deployments found"
            exit 1
          fi

          while IFS= read -r deployment; do
            [ -z "$deployment" ] && continue

            kubectl rollout status \
              "$deployment" \
              --namespace automatic-system \
              --timeout=600s
          done <<< "$deployments"

      - name: Show production status
        if: always()
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods \
            --namespace automatic-system \
            -o wide || true

          echo
          echo "=== Deployments ==="
          kubectl get deployments \
            --namespace automatic-system || true

          echo
          echo "=== StatefulSets ==="
          kubectl get statefulsets \
            --namespace automatic-system || true

          echo
          echo "=== Jobs ==="

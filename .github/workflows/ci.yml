name: Automatic City Services CI/CD

on:
  pull_request:

  push:
    branches:
      - "feature/**"
      - main
      - master

  workflow_dispatch:

concurrency:
  group: automatic-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.9"
  REGISTRY: ghcr.io
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  # ===========================================================================
  # GO QUALITY
  # ===========================================================================

  go-quality:
    name: Go / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            path: "."

          - name: api-gateway
            path: API_Gateway

          - name: auth
            path: Auth_Service

          - name: ticket
            path: Ticket_Service

          - name: department
            path: Department_Service

          - name: brigade
            path: Brigade_Service

          - name: profile
            path: Profile_Service

          - name: location
            path: Location_Service

          - name: routing
            path: Routing_Service

          - name: dispatch
            path: Dispatch_Service

          - name: file
            path: File_Service

          - name: sla
            path: SLA_Service

          - name: notification
            path: Notification_Service

          - name: audit
            path: Audit_Service

          - name: analytics
            path: Analytics_Service

          - name: report
            path: Report_Service

          - name: asset
            path: Asset_Service

          - name: transponder-simulator
            path: Transponder_Simulator

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    # Каждый модуль проверяется независимо.
    # Ошибка одного пути в go.work не должна валить CI всех остальных сервисов.
    env:
      GOWORK: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.path }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail

          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  # ===========================================================================
  # GO WORKSPACE VALIDATION
  # ===========================================================================
  #
  # Отдельная проверка go.work.
  # Она нужна, но её ошибка не должна маскироваться как ошибка всех 18 сервисов.

  go-workspace-validation:
    name: Validate Go workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Validate workspace module paths
        shell: bash
        run: |
          set -euo pipefail

          go work edit -json >/tmp/go-work.json

          missing=0

          while IFS= read -r module; do
            if [ ! -f "$module/go.mod" ]; then
              echo "::error::go.work module does not exist: $module/go.mod"
              missing=1
            fi
          done < <(
            go work edit -json |
              python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for item in data.get("Use", []):
              print(item["DiskPath"])
          '
          )

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All go.work module paths are valid."

  # ===========================================================================
  # DOCKER COMPOSE VALIDATION
  # ===========================================================================

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Настоящие .env в Git не нужны.
      # Для docker compose config достаточно example-файлов.
      - name: Prepare CI env files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r example; do
            target="${example%.example}"

            if [ ! -f "$target" ]; then
              echo "Creating temporary CI env: $target"
              cp "$example" "$target"
            fi
          done < <(
            find . \
              -type f \
              -name '.env.example' \
              -not -path './.git/*' \
              -print
          )

      - name: Validate Compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet

  # ===========================================================================
  # KUBERNETES VALIDATION
  # ===========================================================================
  #
  # ВАЖНО:
  # здесь специально НЕТ kubectl apply --dry-run=client.
  #
  # kubectl apply даже с client dry-run может выполнять API discovery и пытаться
  # подключиться к localhost:8080, если kubeconfig отсутствует.
  #
  # CI должен уметь проверять manifests даже при полностью выключенном сервере.

  kubernetes-validation:
    name: Kubernetes / ${{ matrix.overlay }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        overlay:
          - local
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # local overlay использует:
      #
      # secretGenerator:
      #   envs:
      #     - runtime.env
      #
      # Настоящие secrets CI для рендера не нужны.
      - name: Prepare dummy local secrets
        if: matrix.overlay == 'local'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p k8s/overlays/local/secrets

          cat > k8s/overlays/local/secrets/runtime.env <<'EOF'
          CI_DUMMY_SECRET=ci-validation-only
          EOF

      - name: Render Kustomize
        shell: bash
        run: |
          set -euo pipefail

          kubectl kustomize \
            "k8s/overlays/${{ matrix.overlay }}" \
            > rendered.yaml

          if [ "${{ matrix.overlay }}" = "prod" ]; then
            kubectl kustomize \
              k8s/overlays/prod/checks \
              >> rendered.yaml
          fi

          if [ ! -s rendered.yaml ]; then
            echo "::error::Kustomize rendered an empty manifest"
            exit 1
          fi

          echo "Rendered $(wc -l < rendered.yaml) lines."

      - name: Reject mutable production application images
        if: matrix.overlay == 'prod'
        shell: bash
        run: |
          set -euo pipefail

          if grep -E 'image: .*automatic-system-.*:(latest|dev)$' rendered.yaml; then
            echo "::error::Mutable application image tag found in production overlay"
            exit 1
          fi

  # ===========================================================================
  # APPLICATION IMAGES
  # ===========================================================================

  application-images:
    name: App image / ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - go-quality
      - go-workspace-validation
      - compose-validation
      - kubernetes-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            package: automatic-system-api-gateway
            context: "."
            dockerfile: API_Gateway/Dockerfile

          - service: auth
            package: automatic-system-auth
            context: Auth_Service
            dockerfile: Auth_Service/Dockerfile

          - service: ticket
            package: automatic-system-ticket
            context: Ticket_Service
            dockerfile: Ticket_Service/Dockerfile

          - service: department
            package: automatic-system-department
            context: Department_Service
            dockerfile: Department_Service/Dockerfile

          - service: brigade
            package: automatic-system-brigade
            context: Brigade_Service
            dockerfile: Brigade_Service/Dockerfile

          - service: profile
            package: automatic-system-profile
            context: Profile_Service
            dockerfile: Profile_Service/Dockerfile

          - service: location
            package: automatic-system-location
            context: Location_Service
            dockerfile: Location_Service/Dockerfile

          - service: routing
            package: automatic-system-routing
            context: Routing_Service
            dockerfile: Routing_Service/Dockerfile

          - service: dispatch
            package: automatic-system-dispatch
            context: "."
            dockerfile: Dispatch_Service/Dockerfile

          - service: file
            package: automatic-system-file
            context: File_Service
            dockerfile: File_Service/Dockerfile

          - service: sla
            package: automatic-system-sla
            context: "."
            dockerfile: SLA_Service/Dockerfile

          - service: notification
            package: automatic-system-notification
            context: "."
            dockerfile: Notification_Service/Dockerfile

          - service: audit
            package: automatic-system-audit
            context: "."
            dockerfile: Audit_Service/Dockerfile

          - service: analytics
            package: automatic-system-analytics
            context: "."
            dockerfile: Analytics_Service/Dockerfile

          - service: report
            package: automatic-system-report
            context: "."
            dockerfile: Report_Service/Dockerfile

          - service: asset
            package: automatic-system-asset
            context: "."
            dockerfile: Asset_Service/Dockerfile

          - service: transponder-simulator
            package: automatic-system-transponder-simulator
            context: Transponder_Simulator
            dockerfile: Transponder_Simulator/Dockerfile

          - service: postgres-ha
            package: automatic-system-postgres-ha
            context: .
            dockerfile: k8s/build/postgres-ha/Dockerfile

          - service: postgres-citus-ha
            package: automatic-system-postgres-citus-ha
            context: .
            dockerfile: k8s/build/postgres-citus-ha/Dockerfile

          - service: pgbouncer
            package: automatic-system-pgbouncer
            context: .
            dockerfile: k8s/build/pgbouncer/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry owner
        shell: bash
        run: |
          echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.package }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.service }}
          provenance: true
          sbom: true

  # ===========================================================================
  # MIGRATOR IMAGES
  # ===========================================================================

  migrator-images:
    name: Migrator image / ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - go-quality
      - go-workspace-validation
      - kubernetes-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            package: automatic-system-auth-migrator
            context: Auth_Service

          - service: ticket
            package: automatic-system-ticket-migrator
            context: Ticket_Service

          - service: department
            package: automatic-system-department-migrator
            context: Department_Service

          - service: brigade
            package: automatic-system-brigade-migrator
            context: Brigade_Service

          - service: profile
            package: automatic-system-profile-migrator
            context: Profile_Service

          - service: location
            package: automatic-system-location-migrator
            context: Location_Service

          - service: routing
            package: automatic-system-routing-migrator
            context: Routing_Service

          - service: dispatch
            package: automatic-system-dispatch-migrator
            context: Dispatch_Service

          - service: file
            package: automatic-system-file-migrator
            context: File_Service

          - service: sla
            package: automatic-system-sla-migrator
            context: SLA_Service

          - service: notification
            package: automatic-system-notification-migrator
            context: Notification_Service

          - service: audit
            package: automatic-system-audit-migrator
            context: Audit_Service

          - service: report
            package: automatic-system-report-migrator
            context: Report_Service

          - service: asset
            package: automatic-system-asset-migrator
            context: Asset_Service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry owner
        shell: bash
        run: |
          echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.package }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: k8s/build/Dockerfile.migrator
          build-args: |
            MIGRATIONS_DIR=scheme
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrator-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=migrator-${{ matrix.service }}
          provenance: true
          sbom: true

  # ===========================================================================
  # CLICKHOUSE INIT IMAGE
  # ===========================================================================

  clickhouse-init-image:
    name: ClickHouse init image
    runs-on: ubuntu-latest

    needs:
      - kubernetes-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry owner
        shell: bash
        run: |
          echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/automatic-system-analytics-clickhouse-init
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/build/Dockerfile.clickhouse-init
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clickhouse-init
          cache-to: type=gha,mode=max,scope=clickhouse-init
          provenance: true
          sbom: true

  # ===========================================================================
  # CHECK DEV CLUSTER
  # ===========================================================================
  #
  # Если домашний/dev Kubernetes выключен:
  #   - job остаётся SUCCESS;
  #   - available=false;
  #   - deploy-dev становится SKIPPED.
  #
  # CI, Docker build и push в GHCR продолжают работать.

  check-dev-cluster:
    name: Check dev Kubernetes availability

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    environment:
      name: development

    outputs:
      available: ${{ steps.cluster.outputs.available }}

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Check cluster
        id: cluster
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set +e

          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "KUBECONFIG_B64 is not configured."
            echo "Dev deployment will be skipped."
            exit 0
          fi

          mkdir -p "$HOME/.kube"

          if ! printf '%s' "$KUBECONFIG_B64" |
            base64 --decode > "$HOME/.kube/config"
          then
            echo "KUBECONFIG_B64 cannot be decoded."
            echo "Dev deployment will be skipped."
            exit 0
          fi

          chmod 600 "$HOME/.kube/config"

          if timeout 15s kubectl \
            --request-timeout=10s \
            cluster-info >/dev/null 2>&1
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dev Kubernetes is available."
          else
            echo "Dev Kubernetes is offline or unreachable."
            echo "Dev deployment will be skipped."
          fi

          exit 0

  # ===========================================================================
  # DEV DEPLOY
  # ===========================================================================

  deploy-dev:
    name: Deploy feature branch to dev

    needs:
      - application-images
      - migrator-images
      - clickhouse-init-image
      - check-dev-cluster

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.check-dev-cluster.outputs.available == 'true'

    runs-on: ubuntu-latest

    environment:
      name: development

    concurrency:
      group: automatic-system-development
      cancel-in-progress: true

    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBECONFIG_B64" |
            base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl --request-timeout=10s cluster-info

      - name: Set immutable image tag
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"

          sed -Ei \
            "s/newTag: sha-[0-9a-fA-F]+/newTag: sha-${SHORT_SHA}/g" \
            k8s/overlays/dev/apps/kustomization.yaml \
            k8s/overlays/dev/migrations/kustomization.yaml

      - name: Create namespace
        run: kubectl apply -f k8s/overlays/dev/namespace.yaml

      - name: Apply runtime secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          test -n "$RUNTIME_ENV_B64" || {
            echo "::error::RUNTIME_ENV_B64 is missing"
            exit 1
          }

          test -n "$JWT_PRIVATE_KEY_B64" || {
            echo "::error::JWT_PRIVATE_KEY_B64 is missing"
            exit 1
          }

          test -n "$JWT_PUBLIC_KEY_B64" || {
            echo "::error::JWT_PUBLIC_KEY_B64 is missing"
            exit 1
          }

          RUNTIME_FILE="$(mktemp)"
          PRIVATE_FILE="$(mktemp)"
          PUBLIC_FILE="$(mktemp)"

          cleanup() {
            rm -f "$RUNTIME_FILE" "$PRIVATE_FILE" "$PUBLIC_FILE"
          }

          trap cleanup EXIT

          printf '%s' "$RUNTIME_ENV_B64" |
            base64 --decode > "$RUNTIME_FILE"

          printf '%s' "$JWT_PRIVATE_KEY_B64" |
            base64 --decode > "$PRIVATE_FILE"

          printf '%s' "$JWT_PUBLIC_KEY_B64" |
            base64 --decode > "$PUBLIC_FILE"

          test -s "$RUNTIME_FILE"
          test -s "$PRIVATE_FILE"
          test -s "$PUBLIC_FILE"

          kubectl create secret generic runtime-secrets \
            -n automatic-system-dev \
            --from-env-file="$RUNTIME_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl create secret generic jwt-private-key \
            -n automatic-system-dev \
            --from-file=private.pem="$PRIVATE_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl create secret generic jwt-public-key \
            -n automatic-system-dev \
            --from-file=public.pem="$PUBLIC_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Configure optional private GHCR pull secret
        if: ${{ env.GHCR_PULL_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret docker-registry ghcr-pull \
            -n automatic-system-dev \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME:-${GITHUB_ACTOR}}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl patch serviceaccount default \
            -n automatic-system-dev \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Deploy infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -k k8s/overlays/dev/infra

          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            -n automatic-system-dev \
            --timeout=15m

      - name: Run migrations
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete \
            -k k8s/overlays/dev/migrations \
            --ignore-not-found=true

          kubectl apply \
            -k k8s/overlays/dev/migrations

          kubectl wait \
            --for=condition=complete \
            job \
            --all \
            -n automatic-system-dev \
            --timeout=15m

      - name: Deploy applications
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -k k8s/overlays/dev/apps

          kubectl rollout status \
            deployment \
            --all \
            -n automatic-system-dev \
            --timeout=15m

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          kubectl get pods \
            -n automatic-system-dev \
            -o wide || true

          kubectl get svc \
            -n automatic-system-dev || true

          kubectl get jobs \
            -n automatic-system-dev || true

  # ===========================================================================
  # CHECK PRODUCTION CLUSTER
  # ===========================================================================

  check-prod-cluster:
    name: Check production Kubernetes availability

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    environment:
      name: production

    outputs:
      available: ${{ steps.cluster.outputs.available }}

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Check cluster
        id: cluster
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set +e

          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "KUBECONFIG_B64 is not configured."
            echo "Production deployment will be skipped."
            exit 0
          fi

          mkdir -p "$HOME/.kube"

          if ! printf '%s' "$KUBECONFIG_B64" |
            base64 --decode > "$HOME/.kube/config"
          then
            echo "KUBECONFIG_B64 cannot be decoded."
            echo "Production deployment will be skipped."
            exit 0
          fi

          chmod 600 "$HOME/.kube/config"

          if timeout 15s kubectl \
            --request-timeout=10s \
            cluster-info >/dev/null 2>&1
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Production Kubernetes is available."
          else
            echo "Production Kubernetes is offline or unreachable."
            echo "Production deployment will be skipped."
          fi

          exit 0

  # ===========================================================================
  # PRODUCTION DEPLOY
  # ===========================================================================

  deploy-prod:
    name: Deploy main/master to production

    needs:
      - application-images
      - migrator-images
      - clickhouse-init-image
      - check-prod-cluster

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master') &&
      needs.check-prod-cluster.outputs.available == 'true'

    runs-on: ubuntu-latest

    concurrency:
      group: automatic-system-production
      cancel-in-progress: false

    environment:
      name: production

    env:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBECONFIG_B64" |
            base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl --request-timeout=10s cluster-info

      - name: Set immutable image tag
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"

          sed -Ei \
            "s/newTag: sha-[0-9a-fA-F]+/newTag: sha-${SHORT_SHA}/g" \
            k8s/overlays/prod/apps/kustomization.yaml \
            k8s/overlays/prod/migrations/kustomization.yaml \
            k8s/overlays/prod/infra/kustomization.yaml \
            k8s/overlays/prod/checks/kustomization.yaml

      - name: Create namespace
        run: kubectl apply -k k8s/base/namespace

      - name: Apply runtime secrets
        shell: bash
        env:
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          test -n "$RUNTIME_ENV_B64" || {
            echo "::error::RUNTIME_ENV_B64 is missing"
            exit 1
          }

          test -n "$JWT_PRIVATE_KEY_B64" || {
            echo "::error::JWT_PRIVATE_KEY_B64 is missing"
            exit 1
          }

          test -n "$JWT_PUBLIC_KEY_B64" || {
            echo "::error::JWT_PUBLIC_KEY_B64 is missing"
            exit 1
          }

          RUNTIME_FILE="$(mktemp)"
          PRIVATE_FILE="$(mktemp)"
          PUBLIC_FILE="$(mktemp)"

          cleanup() {
            rm -f "$RUNTIME_FILE" "$PRIVATE_FILE" "$PUBLIC_FILE"
          }

          trap cleanup EXIT

          printf '%s' "$RUNTIME_ENV_B64" |
            base64 --decode > "$RUNTIME_FILE"

          printf '%s' "$JWT_PRIVATE_KEY_B64" |
            base64 --decode > "$PRIVATE_FILE"

          printf '%s' "$JWT_PUBLIC_KEY_B64" |
            base64 --decode > "$PUBLIC_FILE"

          test -s "$RUNTIME_FILE"
          test -s "$PRIVATE_FILE"
          test -s "$PUBLIC_FILE"

          kubectl create secret generic runtime-secrets \
            -n automatic-system \
            --from-env-file="$RUNTIME_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl create secret generic jwt-private-key \
            -n automatic-system \
            --from-file=private.pem="$PRIVATE_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl create secret generic jwt-public-key \
            -n automatic-system \
            --from-file=public.pem="$PUBLIC_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Configure optional private GHCR pull secret
        if: ${{ env.GHCR_PULL_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret docker-registry ghcr-pull \
            -n automatic-system \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME:-${GITHUB_ACTOR}}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl patch serviceaccount default \
            -n automatic-system \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Deploy infrastructure
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete job \
            postgres-backup-bucket-init \
            postgres-platform-backup-init \
            postgres-ticket-citus-backup-init \
            postgres-ticket-citus-distribute \
            -n automatic-system \
            --ignore-not-found=true

          kubectl apply \
            -k k8s/overlays/prod/infra

          kubectl rollout status \
            statefulset \
            --all \
            -n automatic-system \
            --timeout=15m

          kubectl rollout status \
            deployment \
            --all \
            -n automatic-system \
            --timeout=15m

      - name: Run migrations
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete \
            -k k8s/overlays/prod/migrations \
            --ignore-not-found=true

          kubectl apply \
            -k k8s/overlays/prod/migrations

          kubectl wait \
            --for=condition=complete \
            job \
            --all \
            -n automatic-system \
            --timeout=15m

      - name: Verify PgBouncer connectivity
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete \
            -k k8s/overlays/prod/checks \
            --ignore-not-found=true

          kubectl apply \
            -k k8s/overlays/prod/checks

          kubectl wait \
            --for=condition=complete \
            job/pgbouncer-connectivity-check \
            -n automatic-system \
            --timeout=5m

          kubectl logs \
            job/pgbouncer-connectivity-check \
            -n automatic-system

      - name: Deploy applications
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -k k8s/overlays/prod/apps

          kubectl rollout status \
            deployment \
            --all \
            -n automatic-system \
            --timeout=15m

      - name: Apply production NetworkPolicies
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -k k8s/overlays/prod/network

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods \
            -n automatic-system \
            -o wide || true

          echo
          echo "=== Services ==="
          kubectl get svc \
            -n automatic-system || true

          echo
          echo "=== HPA ==="
          kubectl get hpa \
            -n automatic-system || true

          echo
          echo "=== PDB ==="
          kubectl get pdb \
            -n automatic-system || true

          echo
          echo "=== Jobs ==="
          kubectl get jobs \
            -n automatic-system || true

services:
  profile-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profile
    ports:
      - "50055:50055"
    env_file:
      - .env
    environment:
      GRPC_PORT: "50055"
      KAFKA_BROKERS: "kafka:9092"
      OUTBOX_WORKER_COUNT: ${OUTBOX_WORKER_COUNT:-4}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR:-host.docker.internal:50051}
      DEPARTMENT_GRPC_ADDR: ${DEPARTMENT_GRPC_ADDR:-host.docker.internal:50053}
    depends_on:
      migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-profile:
    image: postgres:16
    container_name: profile-postgres
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build: ./migrator
    container_name: profile-migrator
    env_file:
      - .env
    depends_on:
      postgres-profile:
        condition: service_healthy
    volumes:
      - ./scheme:/migrations
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: profile-kafka
    ports:
      - "29093:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_profile_data:

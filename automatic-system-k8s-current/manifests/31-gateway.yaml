---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: automatic-system
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: automatic-system/api-gateway:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: GATEWAY_ADDR
          value: :8081
        - name: AUTH_SERVICE_ADDR
          value: auth-service:50051
        - name: TICKET_SERVICE_ADDR
          value: ticket-service:50052
        - name: DEPARTMENT_SERVICE_ADDR
          value: department-service:50053
        - name: BRIGADE_SERVICE_ADDR
          value: brigade-service:50054
        - name: PROFILE_SERVICE_ADDR
          value: profile-service:50055
        - name: JWT_PUBLIC_KEY_PATH
          value: /app/keys/public.pem
        - name: JWT_ISSUER
          value: auth-jwt
        - name: JWT_AUDIENCE
          value: api-gateway
        - name: REDIS_ADDR
          value: redis-gateway:6379
        - name: REDIS_PASSWORD
          value: ''
        - name: REDIS_DB
          value: '0'
        - name: RATE_LIMIT_PREFIX
          value: gateway:ratelimit
        - name: FILE_SERVICE_ADDR
          value: file-service:50059
        - name: SLA_SERVICE_ADDR
          value: sla-service:50060
        - name: NOTIFICATION_SERVICE_ADDR
          value: notification-service:50061
        - name: AUDIT_SERVICE_ADDR
          value: audit-service:50062
        - name: ANALYTICS_SERVICE_ADDR
          value: analytics-service:50063
        - name: REPORT_SERVICE_ADDR
          value: report-service:50064
        - name: REPORT_INTERNAL_URL
          value: http://report-service:8084
        - name: REPORT_INTERNAL_TOKEN
          value: change-this-report-internal-token
        - name: ASSET_SERVICE_ADDR
          value: asset-service:50065
        - name: NOTIFICATION_LIVE_PREFIX
          value: 'notifications:user:'
        - name: CORS_ALLOWED_ORIGINS
          value: http://localhost:3000,http://127.0.0.1:3000
        ports:
        - name: http
          containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: jwt-public
          mountPath: /app/keys/public.pem
          subPath: public.pem
          readOnly: true
      volumes:
      - name: jwt-public
        secret:
          secretName: jwt-public-key

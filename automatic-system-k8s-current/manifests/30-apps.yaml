  selector:
    app: report-service
  ports:
  - name: grpc
    port: 50064
    targetPort: 50064
  - name: internal
    port: 8084
    targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
      - name: report-service
        image: automatic-system/report:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: postgres://report:report@postgres-report:5432/report?sslmode=disable
        - name: REPORT_INTERNAL_TOKEN
          value: change-this-report-internal-token
        - name: INTERNAL_HTTP_PORT
          value: '8084'
        ports:
        - name: grpc
          containerPort: 50064
        - name: internal
          containerPort: 8084
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 50064
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 50064
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6

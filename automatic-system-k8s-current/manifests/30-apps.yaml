---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: automatic-system
spec:
  selector:
    app: auth-service
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: automatic-system/auth:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: GRPC_PORT
          value: '50051'
        - name: DB_HOST
          value: postgres-auth
        - name: DB_PORT
          value: '5432'
        - name: DB_USERNAME
          value: auth_user
        - name: DB_PASSWORD
          value: change-me
        - name: DB_NAME
          value: auth_db
        - name: SSLMODE
          value: disable
        - name: JWT_PRIVATE_KEY_PATH
          value: /app/keys/private.pem
        - name: JWT_KEY_ID
          value: local-dev-key
        - name: SMTP_HOST
          value: mailhog
        - name: SMTP_PORT
          value: '1025'
        - name: SMTP_USERNAME
          value: ''
        - name: SMTP_PASSWORD
          value: ''
        - name: SMTP_FROM_EMAIL
          value: no-reply@automatic-system.local
        - name: SMTP_FROM_NAME
          value: Automatic System
        - name: SMTP_USE_TLS
          value: 'false'
        - name: SMTP_USE_STARTTLS
          value: 'false'
        - name: FRONTEND_BASE_URL
          value: http://localhost:3000
        - name: KAFKA_BROKERS
          value: kafka-1:9092,kafka-2:9092,kafka-3:9092
        - name: OUTBOX_WORKER_COUNT
          value: '4'
        ports:
        - name: grpc
          containerPort: 50051
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: jwt-private
          mountPath: /app/keys/private.pem
          subPath: private.pem
          readOnly: true
      volumes:
      - name: jwt-private
        secret:
          secretName: jwt-private-key
---

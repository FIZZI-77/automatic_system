---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: automatic-system
spec:
  selector:
    app: mailhog
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: ui
    port: 8025
    targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:v1.0.1
        imagePullPolicy: IfNotPresent
        env: []
        ports:
        - name: smtp
          containerPort: 1025
        - name: ui
          containerPort: 8025
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 1025
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 1025
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: automatic-system
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: automatic-system
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-07-23T15-54-02Z
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        ports:
        - name: main
          containerPort: 9000
        - name: console
          containerPort: 9001
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - minio
        args:
        - server
        - /data
        - --console-address
        - :9001
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: automatic-system
spec:
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: automatic-system
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.8
        env:
        - name: CLICKHOUSE_DB
          value: analytics
        - name: CLICKHOUSE_USER
          value: analytics
        - name: CLICKHOUSE_PASSWORD
          value: change-me
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: '1'
        ports:
        - name: main
          containerPort: 8123
        - name: native
          containerPort: 9000
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: automatic-system
spec:
  selector:
    app: valhalla
  ports:
  - name: http
    port: 8002
    targetPort: 8002
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valhalla
  namespace: automatic-system
spec:
  serviceName: valhalla
  replicas: 1
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      containers:
      - name: valhalla
        image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
        env:
        - name: tile_urls
          value: https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
        - name: serve_tiles
          value: 'True'
        - name: build_elevation
          value: 'False'
        - name: build_admins
          value: 'True'
        - name: build_time_zones
          value: 'True'
        - name: server_threads
          value: '2'
        ports:
        - name: main
          containerPort: 8002
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /custom_files
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi

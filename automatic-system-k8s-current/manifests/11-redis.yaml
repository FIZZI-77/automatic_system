---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-location-sentinel-config
  namespace: automatic-system
data:
  sentinel.conf: |
    port 26379
    
    sentinel resolve-hostnames yes
    
    sentinel announce-hostnames yes
    
    sentinel monitor location-master redis-location-master 6379 2

    sentinel down-after-milliseconds location-master 5000

    sentinel failover-timeout location-master 10000

    sentinel parallel-syncs location-master 1


---
apiVersion: v1
kind: Service
metadata:
  name: redis-location-sentinel-1
  namespace: automatic-system
spec:
  selector:
    app: redis-location-sentinel-1
  ports:
  - name: sentinel
    port: 26379
    targetPort: 26379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-location-sentinel-1
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-location-sentinel-1
  template:
    metadata:
      labels:
        app: redis-location-sentinel-1
    spec:
      containers:
      - name: sentinel
        image: redis:7.4-alpine
        command:
        - sh
        - -c
        args:
        - cp /sentinel/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf
          --sentinel
        ports:
        - containerPort: 26379
          name: sentinel
        volumeMounts:
        - name: config
          mountPath: /sentinel
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: redis-location-sentinel-config
      - name: data
        emptyDir: {}

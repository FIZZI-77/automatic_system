---
apiVersion: v1
kind: Service
metadata:
  name: redis-gateway
  namespace: automatic-system
spec:
  selector:
    app: redis-gateway
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-gateway
  namespace: automatic-system
spec:
  serviceName: redis-gateway
  replicas: 1
  selector:
    matchLabels:
      app: redis-gateway
  template:
    metadata:
      labels:
        app: redis-gateway
    spec:
      containers:
      - name: redis-gateway
        image: redis:7.4-alpine
        env: []
        ports:
        - name: main
          containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - redis-server
        args:
        - --appendonly
        - 'yes'
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 512Mi
---

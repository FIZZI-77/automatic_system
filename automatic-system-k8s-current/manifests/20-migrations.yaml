apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: automatic-system
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: clickhouse-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: automatic-system/analytics-clickhouse-init:dev
        imagePullPolicy: IfNotPresent
        command:
        - clickhouse-client
        args:
        - --host
        - clickhouse
        - --user
        - analytics
        - --password
        - change-me
        - --multiquery
        - --queries-file
        - /schema/001_events.sql

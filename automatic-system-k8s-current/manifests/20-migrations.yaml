---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: automatic-system
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: apache/kafka:3.9.1
        command:
        - sh
        - -c
        args:
        - 'set -e

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic auth.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic profiles.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic departments.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic brigades.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic tickets.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic routing.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic locations.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic dispatch.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic files.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic sla.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic notifications.events.v1 --partitions 3 --replication-factor
          3

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create
          --if-not-exists --topic reports.events.v1 --partitions 3 --replication-factor
          3

          '
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator-auth
  namespace: automatic-system
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: migrator-auth
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrator
        image: automatic-system/auth-migrator:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: GOOSE_DRIVER
          value: postgres
        - name: GOOSE_DBSTRING
          value: postgres://auth_user:change-me@postgres-auth:5432/auth_db?sslmode=disable
        args:
        - -dir
        - /migrations
        - up

version: "3.9"

services:
  api-gateway:
    build:
      context: .
      dockerfile: API_Gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8081:8081"
    environment:
      GATEWAY_ADDR: ":8081"
      AUTH_SERVICE_ADDR: "auth-service:50051"
      TICKET_SERVICE_ADDR: "ticket-service:50052"
      JWT_PUBLIC_KEY_PATH: "/app/keys/public.pem"
      JWT_ISSUER: "auth-jwt"
      JWT_AUDIENCE: "api-gateway"
    volumes:
      - ./API_Gateway/keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      - auth-service
      - ticket-service
    restart: unless-stopped

  ticket-service:
    build:
      context: ./Ticket_Service
      dockerfile: Dockerfile
    container_name: ticket
    ports:
      - "50052:50052"
    env_file:
      - ./Ticket_Service/.env
    environment:
      GRPC_ADDR: ":50052"
      DB_HOST: ${TICKET_DB_HOST}
      DB_PORT: ${TICKET_DB_PORT}
    depends_on:
      postgres-ticket:
        condition: service_healthy
      migrator-ticket:
        condition: service_completed_successfully

    volumes:
      - ./keys:/app/keys:ro
    restart: unless-stopped

  auth-service:
    build:
      context: ./Auth_Service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "50051:50051"
    env_file:
      - ./Auth_Service/.env
    environment:
      GRPC_ADDR: ":50051"
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: ${AUTH_DB_PORT}
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
    depends_on:
      postgres-auth:
        condition: service_healthy
      migrator-auth:
        condition: service_completed_successfully
    volumes:
      - ./Auth_Service/keys:/app/keys:ro
    restart: unless-stopped

  postgres-auth:
    image: postgres:16
    container_name: auth-postgres
    env_file:
      - ./Auth_Service/.env
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PUBLISHED_PORT}:${AUTH_DB_PORT}"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ticket:
    image: postgres:16
    container_name: ticket-postgres
    env_file:
      - ./Ticket_Service/.env
    environment:
      POSTGRES_USER: ${TICKET_DB_USERNAME}
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD}
      POSTGRES_DB: ${TICKET_DB_NAME}
    ports:
      - "${TICKET_DB_PUBLISHED_PORT}:${TICKET_DB_PORT}"
    volumes:
      - postgres_ticket_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TICKET_DB_USERNAME} -d ${TICKET_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10


  mailhog:
    image: mailhog/mailhog:latest
    container_name: auth-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  migrator-auth:
    build:
      context: ./Auth_Service/migrator
      dockerfile: Dockerfile
    container_name: auth-migrator
    env_file:
      - ./Auth_Service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./Auth_Service/scheme:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}?sslmode=${AUTH_DB_SSLMODE}
    command: >
      sh -c "
        echo 'Running migrations...' &&
        goose -dir /migrations up
      "

  migrator-ticket:
    build:
      context: ./Ticket_Service/migrator
      dockerfile: Dockerfile
    container_name: ticket-migrator
    env_file:
      - ./Ticket_Service/.env
    depends_on:
      postgres-ticket:
        condition: service_healthy
    volumes:
      - ./Ticket_Service/scheme:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${TICKET_DB_USERNAME}:${TICKET_DB_PASSWORD}@${TICKET_DB_HOST}:${TICKET_DB_PORT}/${TICKET_DB_NAME}?sslmode=${TICKET_DB_SSLMODE}
    command: >
      sh -c "
        echo 'Running migrations...' &&
        goose -dir /migrations up
      "

volumes:
  postgres_auth_data:
  postgres_ticket_data:

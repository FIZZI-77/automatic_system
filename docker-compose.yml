      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-storage-init:
    image: apache/kafka:3.9.1
    container_name: kafka-storage-init
    user: "0:0"
    volumes:
      - kafka_1_data:/data/kafka-1
      - kafka_2_data:/data/kafka-2
      - kafka_3_data:/data/kafka-3
    command:
      - /bin/bash
      - -ec
      - chown -R 1000:1000 /data/kafka-1 /data/kafka-2 /data/kafka-3
    restart: "no"

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        topics=(
          auth.events.v1
          profiles.events.v1
          departments.events.v1
          brigades.events.v1
          tickets.events.v1
          routing.events.v1
          locations.events.v1
          sla.events.v1
          notifications.events.v1
          reports.events.v1
          assets.events.v1
        )
        for topic in "$${topics[@]}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 6 \
            --replication-factor 3 \
            --config min.insync.replicas=2
        done
        retry_sources=(profiles.events.v1 tickets.events.v1 routing.events.v1)
        for source in "$${retry_sources[@]}"; do
          for suffix in retry dlq; do
            /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
              --create --if-not-exists \
              --topic "$${source}.$${suffix}" \
              --partitions 2 \
              --replication-factor 3 \
              --config min.insync.replicas=2
          done
        done
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: auth-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    restart: unless-stopped


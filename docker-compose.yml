services:
  api-gateway:
    build:
      context: .
      dockerfile: API_Gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./API_Gateway/.env
    ports:
      - "${API_GATEWAY_PORT}:8081"
    volumes:
      - type: bind
        source: ./keys/public.pem
        target: /app/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      auth-service:
        condition: service_started
      ticket-service:
        condition: service_started
      department-service:
        condition: service_started
      brigade-service:
        condition: service_started
      profile-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: ./Auth_Service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - ./Auth_Service/.env
    ports:
      - "${AUTH_GRPC_PORT}:50051"
    volumes:
      - type: bind
        source: ./keys/private.pem
        target: /app/keys/private.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrator-auth:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    restart: unless-stopped

  ticket-service:
    build:
      context: ./Ticket_Service
      dockerfile: Dockerfile
    container_name: ticket-service
    env_file:
      - ./Ticket_Service/.env
    ports:
      - "${TICKET_GRPC_PORT}:50052"
    depends_on:
      migrator-ticket:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  department-service:
    build:
      context: ./Department_Service
      dockerfile: Dockerfile
    container_name: department-service
    env_file:
      - ./Department_Service/.env
    ports:
      - "${DEPARTMENT_GRPC_PORT}:50053"
    depends_on:
      migrator-department:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  profile-service:
    build:
      context: ./Profile_service
      dockerfile: Dockerfile
    container_name: profile-service
    env_file:
      - ./Profile_service/.env
    ports:
      - "${PROFILE_GRPC_PORT}:50055"
    depends_on:
      migrator-profile:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      department-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  brigade-service:
    build:
      context: ./Brigade_Service
      dockerfile: Dockerfile
    container_name: brigade-service
    env_file:
      - ./Brigade_Service/.env
    ports:
      - "${BRIGADE_GRPC_PORT}:50054"
    depends_on:
      migrator-brigade:
        condition: service_completed_successfully
      department-service:
        condition: service_started
      profile-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres-auth:
    image: postgres:16
    container_name: auth-postgres
    env_file:
      - ./Auth_Service/.env
    ports:
      - "${AUTH_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-ticket:
    image: postgres:16
    container_name: ticket-postgres
    env_file:
      - ./Ticket_Service/.env
    ports:
      - "${TICKET_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_ticket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-department:
    image: postgres:16
    container_name: department-postgres
    env_file:
      - ./Department_Service/.env
    ports:
      - "${DEPARTMENT_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_department_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-brigade:
    image: postgis/postgis:16-3.4
    container_name: brigade-postgres
    env_file:
      - ./Brigade_Service/.env
    ports:
      - "${BRIGADE_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_brigade_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-profile:
    image: postgres:16
    container_name: profile-postgres
    env_file:
      - ./Profile_service/.env
    ports:
      - "${PROFILE_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator-auth:
    build:
      context: ./Auth_Service/migrator
      dockerfile: Dockerfile
    container_name: auth-migrator
    env_file:
      - ./Auth_Service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./Auth_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-ticket:
    build:
      context: ./Ticket_Service/migrator
      dockerfile: Dockerfile
    container_name: ticket-migrator
    env_file:
      - ./Ticket_Service/.env
    depends_on:
      postgres-ticket:
        condition: service_healthy
    volumes:
      - ./Ticket_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-department:
    build:
      context: ./Department_Service/migrator
      dockerfile: Dockerfile
    container_name: department-migrator
    env_file:
      - ./Department_Service/.env
    depends_on:
      postgres-department:
        condition: service_healthy
    volumes:
      - ./Department_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-brigade:
    build:
      context: ./Brigade_Service/migrator
      dockerfile: Dockerfile
    container_name: brigade-migrator
    env_file:
      - ./Brigade_Service/.env
    depends_on:
      postgres-brigade:
        condition: service_healthy
    volumes:
      - ./Brigade_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-profile:
    build:
      context: ./Profile_service/migrator
      dockerfile: Dockerfile
    container_name: profile-migrator
    env_file:
      - ./Profile_service/.env
    depends_on:
      postgres-profile:
        condition: service_healthy
    volumes:
      - ./Profile_service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  kafka-1:
    image: apache/kafka:3.9.1
    hostname: kafka-1
    container_name: kafka-1
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_1_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.9.1
    hostname: kafka-2
    container_name: kafka-2
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    volumes:
      - kafka_2_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.9.1
    hostname: kafka-3
    container_name: kafka-3
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    volumes:
      - kafka_3_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-storage-init:
    image: apache/kafka:3.9.1
    container_name: kafka-storage-init
    user: "0:0"
    volumes:
      - kafka_1_data:/data/kafka-1
      - kafka_2_data:/data/kafka-2
      - kafka_3_data:/data/kafka-3
    command:
      - /bin/bash
      - -ec
      - chown -R 1000:1000 /data/kafka-1 /data/kafka-2 /data/kafka-3
    restart: "no"

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        topics=(
          auth.events.v1
          profiles.events.v1
          departments.events.v1
          brigades.events.v1
          tickets.events.v1
        )
        for topic in "$${topics[@]}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 6 \
            --replication-factor 3 \
            --config min.insync.replicas=2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists \
          --topic profiles.events.v1.retry \
          --partitions 2 \
          --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists \
          --topic profiles.events.v1.dlq \
          --partitions 2 \
          --replication-factor 3 \
          --config min.insync.replicas=2
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: auth-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    restart: unless-stopped

volumes:
  postgres_auth_data:
  postgres_ticket_data:
  postgres_department_data:
  postgres_brigade_data:
  postgres_profile_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

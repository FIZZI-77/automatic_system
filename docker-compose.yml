services:
  api-gateway:
    build:
      context: .
      dockerfile: API_Gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./API_Gateway/.env
    ports:
      - "${API_GATEWAY_PORT}:8081"
    volumes:
      - type: bind
        source: ./keys/public.pem
        target: /app/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      auth-service:
        condition: service_started
      ticket-service:
        condition: service_started
      department-service:
        condition: service_started
      brigade-service:
        condition: service_started
      profile-service:
        condition: service_started
      location-service:
        condition: service_started
      routing-service:
        condition: service_started
      dispatch-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: ./Auth_Service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - ./Auth_Service/.env
    ports:
      - "${AUTH_GRPC_PORT}:50051"
    volumes:
      - type: bind
        source: ./keys/private.pem
        target: /app/keys/private.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrator-auth:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    restart: unless-stopped

  ticket-service:
    build:
      context: ./Ticket_Service
      dockerfile: Dockerfile
    container_name: ticket-service
    env_file:
      - ./Ticket_Service/.env
    environment:
      KAFKA_ROUTING_TOPIC: routing.events.v1
    ports:
      - "${TICKET_GRPC_PORT}:50052"
    depends_on:
      migrator-ticket:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  department-service:
    build:
      context: ./Department_Service
      dockerfile: Dockerfile
    container_name: department-service
    env_file:
      - ./Department_Service/.env
    ports:
      - "${DEPARTMENT_GRPC_PORT}:50053"
    depends_on:
      migrator-department:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  profile-service:
    build:
      context: ./Profile_service
      dockerfile: Dockerfile
    container_name: profile-service
    env_file:
      - ./Profile_service/.env
    ports:
      - "${PROFILE_GRPC_PORT}:50055"
    depends_on:
      migrator-profile:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      department-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  brigade-service:
    build:
      context: ./Brigade_Service
      dockerfile: Dockerfile
    container_name: brigade-service
    env_file:
      - ./Brigade_Service/.env
    environment:
      KAFKA_ROUTING_TOPIC: routing.events.v1
      KAFKA_TICKET_TOPIC: tickets.events.v1
    ports:
      - "${BRIGADE_GRPC_PORT}:50054"
    depends_on:
      migrator-brigade:
        condition: service_completed_successfully
      department-service:
        condition: service_started
      profile-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  location-service:
    build:
      context: .
      dockerfile: Location_Service/Dockerfile
      additional_contexts:
        service: ./Location_Service
    container_name: location-service
    environment:
      DATABASE_URL: postgres://location:location@postgres-location:5432/location?sslmode=disable
      REDIS_MASTER_NAME: location-master
      REDIS_SENTINEL_ADDRS: redis-location-sentinel-1:26379,redis-location-sentinel-2:26379,redis-location-sentinel-3:26379
      REDIS_SENTINEL_PASSWORD: ""
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "20"
      REDIS_MIN_IDLE_CONNS: "5"
      GRPC_PORT: "50056"
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      TRANSPONDER_API_KEY: ${TRANSPONDER_API_KEY:-}
      HISTORY_BUFFER_CAPACITY: "10000"
      HISTORY_BATCH_SIZE: "500"
      HISTORY_FLUSH_INTERVAL: 5s
      SIGNAL_SCAN_INTERVAL: 5s
      SIGNAL_STALE_AFTER: 15s
      SIGNAL_OFFLINE_AFTER: 60s
      SIGNAL_BATCH_SIZE: "500"
      SHUTDOWN_TIMEOUT: 20s
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_LOCATION_TOPIC: locations.events.v1
      REDIS_EVENTS_STREAM: locations:events
      REDIS_EVENTS_GROUP: location-kafka-relay
      REDIS_EVENTS_CONSUMER: location-service
    ports:
      - "${LOCATION_GRPC_PORT}:50056"
      - "${LOCATION_HTTP_PORT}:8080"
    depends_on:
      migrator-location:
        condition: service_completed_successfully
      redis-location-sentinel-1:
        condition: service_healthy
      redis-location-sentinel-2:
        condition: service_healthy
      redis-location-sentinel-3:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    restart: unless-stopped

  routing-service:
    build:
      context: .
      dockerfile: Routing_Service/Dockerfile
      additional_contexts:
        service: ./Routing_Service
    container_name: routing-service
    environment:
      DATABASE_URL: postgres://routing:routing@postgres-routing:5432/routing?sslmode=disable
      GRPC_PORT: "50057"
      VALHALLA_URL: http://valhalla:8002
      VALHALLA_TIMEOUT: 15s
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_ROUTING_TOPIC: routing.events.v1
      KAFKA_TICKET_TOPIC: tickets.events.v1
      OUTBOX_WORKER_COUNT: "4"
      SHUTDOWN_TIMEOUT: 20s
      LOG_LEVEL: info
    ports:
      - "${ROUTING_GRPC_PORT}:50057"
    depends_on:
      migrator-routing:
        condition: service_completed_successfully
      valhalla:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    restart: unless-stopped

  dispatch-service:
    build:
      context: .
      dockerfile: Dispatch_Service/Dockerfile
    container_name: dispatch-service
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres-dispatch:5432/dispatch?sslmode=disable
      GRPC_PORT: "50058"
      TICKET_SERVICE_ADDR: ticket-service:50052
      BRIGADE_SERVICE_ADDR: brigade-service:50054
      RESERVATION_TTL: 2m
      CLEANUP_INTERVAL: 15s
    ports:
      - "${DISPATCH_GRPC_PORT}:50058"
    depends_on:
      migrator-dispatch:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
      brigade-service:
        condition: service_started
      location-service:
        condition: service_started
      routing-service:
        condition: service_started
    restart: unless-stopped

  postgres-dispatch:
    image: postgres:16
    container_name: dispatch-postgres
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "${DISPATCH_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_dispatch_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgres-routing:
    image: postgres:16
    container_name: routing-postgres
    environment:
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
      POSTGRES_DB: routing
    ports:
      - "${ROUTING_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_routing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: valhalla
    environment:
      tile_urls: ${VALHALLA_TILE_URL}
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
    ports:
      - "${VALHALLA_PORT}:8002"
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      start_period: 10m
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  postgres-auth:
    image: postgres:16
    container_name: auth-postgres
    env_file:
      - ./Auth_Service/.env
    ports:
      - "${AUTH_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-ticket:
    image: postgres:16
    container_name: ticket-postgres
    env_file:
      - ./Ticket_Service/.env
    ports:
      - "${TICKET_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_ticket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-department:
    image: postgres:16
    container_name: department-postgres
    env_file:
      - ./Department_Service/.env
    ports:
      - "${DEPARTMENT_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_department_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-brigade:
    image: postgis/postgis:16-3.4
    container_name: brigade-postgres
    env_file:
      - ./Brigade_Service/.env
    ports:
      - "${BRIGADE_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_brigade_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-profile:
    image: postgres:16
    container_name: profile-postgres
    env_file:
      - ./Profile_service/.env
    ports:
      - "${PROFILE_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-location:
    image: postgis/postgis:16-3.4
    container_name: location-postgres
    environment:
      POSTGRES_USER: location
      POSTGRES_PASSWORD: location
      POSTGRES_DB: location
    ports:
      - "${LOCATION_DB_PUBLISHED_PORT}:5432"
    volumes:
      - postgres_location_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location -d location"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis-location-master:
    image: redis:7.4-alpine
    container_name: location-redis-master
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LOCATION_REDIS_PUBLISHED_PORT}:6379"
    volumes:
      - redis_location_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis-location-replica-1:
    image: redis:7.4-alpine
    container_name: location-redis-replica-1
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-location-master", "6379"]
    ports:
      - "${LOCATION_REDIS_REPLICA_1_PORT}:6379"
    volumes:
      - redis_location_replica_1_data:/data
    depends_on:
      redis-location-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis-location-replica-2:
    image: redis:7.4-alpine
    container_name: location-redis-replica-2
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-location-master", "6379"]
    ports:
      - "${LOCATION_REDIS_REPLICA_2_PORT}:6379"
    volumes:
      - redis_location_replica_2_data:/data
    depends_on:
      redis-location-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis-location-sentinel-1:
    image: redis:7.4-alpine
    container_name: location-redis-sentinel-1
    command: ["sh", "-c", "test -f /data/sentinel.conf || cp /sentinel/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel"]
    ports:
      - "${LOCATION_REDIS_SENTINEL_1_PORT}:26379"
    volumes:
      - ./Location_Service/redis/sentinel.conf:/sentinel/sentinel.conf:ro
      - redis_location_sentinel_1_data:/data
    depends_on:
      redis-location-replica-1:
        condition: service_healthy
      redis-location-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis-location-sentinel-2:
    image: redis:7.4-alpine
    container_name: location-redis-sentinel-2
    command: ["sh", "-c", "test -f /data/sentinel.conf || cp /sentinel/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel"]
    ports:
      - "${LOCATION_REDIS_SENTINEL_2_PORT}:26379"
    volumes:
      - ./Location_Service/redis/sentinel.conf:/sentinel/sentinel.conf:ro
      - redis_location_sentinel_2_data:/data
    depends_on:
      redis-location-replica-1:
        condition: service_healthy
      redis-location-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis-location-sentinel-3:
    image: redis:7.4-alpine
    container_name: location-redis-sentinel-3
    command: ["sh", "-c", "test -f /data/sentinel.conf || cp /sentinel/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel"]
    ports:
      - "${LOCATION_REDIS_SENTINEL_3_PORT}:26379"
    volumes:
      - ./Location_Service/redis/sentinel.conf:/sentinel/sentinel.conf:ro
      - redis_location_sentinel_3_data:/data
    depends_on:
      redis-location-replica-1:
        condition: service_healthy
      redis-location-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrator-auth:
    build:
      context: ./Auth_Service/migrator
      dockerfile: Dockerfile
    container_name: auth-migrator
    env_file:
      - ./Auth_Service/.env
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./Auth_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-ticket:
    build:
      context: ./Ticket_Service/migrator
      dockerfile: Dockerfile
    container_name: ticket-migrator
    env_file:
      - ./Ticket_Service/.env
    depends_on:
      postgres-ticket:
        condition: service_healthy
    volumes:
      - ./Ticket_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-department:
    build:
      context: ./Department_Service/migrator
      dockerfile: Dockerfile
    container_name: department-migrator
    env_file:
      - ./Department_Service/.env
    depends_on:
      postgres-department:
        condition: service_healthy
    volumes:
      - ./Department_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-brigade:
    build:
      context: ./Brigade_Service/migrator
      dockerfile: Dockerfile
    container_name: brigade-migrator
    env_file:
      - ./Brigade_Service/.env
    depends_on:
      postgres-brigade:
        condition: service_healthy
    volumes:
      - ./Brigade_Service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-profile:
    build:
      context: ./Profile_service/migrator
      dockerfile: Dockerfile
    container_name: profile-migrator
    env_file:
      - ./Profile_service/.env
    depends_on:
      postgres-profile:
        condition: service_healthy
    volumes:
      - ./Profile_service/scheme:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
    command: >
      sh -c 'export GOOSE_DBSTRING="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${SSLMODE}";
      goose -dir /migrations up'

  migrator-location:
    build:
      context: ./Location_Service/migrator
      dockerfile: Dockerfile
    container_name: location-migrator
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://location:location@postgres-location:5432/location?sslmode=disable
    command: ["-dir", "/migrations", "up"]
    volumes:
      - ./Location_Service/scheme:/migrations:ro
    depends_on:
      postgres-location:
        condition: service_healthy

  migrator-dispatch:
    build:
      context: ./Dispatch_Service/migrator
      dockerfile: Dockerfile
    container_name: dispatch-migrator
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://dispatch:dispatch@postgres-dispatch:5432/dispatch?sslmode=disable
    command: ["-dir", "/migrations", "up"]
    volumes:
      - ./Dispatch_Service/scheme:/migrations:ro
    depends_on:
      postgres-dispatch:
        condition: service_healthy
  migrator-routing:
    build:
      context: ./Routing_Service/migrator
      dockerfile: Dockerfile
    container_name: routing-migrator
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://routing:routing@postgres-routing:5432/routing?sslmode=disable
    command: ["-dir", "/migrations", "up"]
    volumes:
      - ./Routing_Service/scheme:/migrations:ro
    depends_on:
      postgres-routing:
        condition: service_healthy

  kafka-1:
    image: apache/kafka:3.9.1
    hostname: kafka-1
    container_name: kafka-1
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_1_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.9.1
    hostname: kafka-2
    container_name: kafka-2
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    volumes:
      - kafka_2_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.9.1
    hostname: kafka-3
    container_name: kafka-3
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    volumes:
      - kafka_3_data:/tmp/kraft-combined-logs
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-storage-init:
    image: apache/kafka:3.9.1
    container_name: kafka-storage-init
    user: "0:0"
    volumes:
      - kafka_1_data:/data/kafka-1
      - kafka_2_data:/data/kafka-2
      - kafka_3_data:/data/kafka-3
    command:
      - /bin/bash
      - -ec
      - chown -R 1000:1000 /data/kafka-1 /data/kafka-2 /data/kafka-3
    restart: "no"

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        topics=(
          auth.events.v1
          profiles.events.v1
          departments.events.v1
          brigades.events.v1
          tickets.events.v1
        )
        for topic in "$${topics[@]}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 6 \
            --replication-factor 3 \
            --config min.insync.replicas=2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists \
          --topic profiles.events.v1.retry \
          --partitions 2 \
          --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --create --if-not-exists \
          --topic profiles.events.v1.dlq \
          --partitions 2 \
          --replication-factor 3 \
          --config min.insync.replicas=2
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: auth-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    restart: unless-stopped


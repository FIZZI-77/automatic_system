apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok-tunnel
  labels:
    app.kubernetes.io/name: ngrok-tunnel
    app.kubernetes.io/component: edge-tunnel
    app.kubernetes.io/part-of: automatic-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ngrok-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ngrok-tunnel
        app.kubernetes.io/component: edge-tunnel
        app.kubernetes.io/part-of: automatic-system
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ngrok
          image: ngrok/ngrok:latest
          imagePullPolicy: Always
          args:
            - http
            - http://istio-ingressgateway.istio-system.svc.cluster.local:80
            - --host-header=tunnel.automatic-system.internal
            - --log=stdout
            - --log-format=json
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom:
                secretKeyRef:
                  name: ngrok-authtoken
                  key: authtoken
            - name: HOME
              value: /tmp
          ports:
            - name: inspector
              containerPort: 4040
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/tunnels
              port: inspector
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/tunnels
              port: inspector
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

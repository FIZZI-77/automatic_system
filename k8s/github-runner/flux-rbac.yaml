apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-flux-deployer
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-flux-deployer
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: github-runner
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-runner-flux-deployer

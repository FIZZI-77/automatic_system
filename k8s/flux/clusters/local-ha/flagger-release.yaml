apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  chart:
    spec:
      chart: flagger
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: flagger
      version: 1.45.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: flagger
  storageNamespace: flagger-system
  targetNamespace: flagger-system
  timeout: 5m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    crd:
      create: false
    meshProvider: istio
    metricsServer: http://prometheus.automatic-system.svc.cluster.local:9090
    podAnnotations:
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      sidecar.istio.io/inject: "true"

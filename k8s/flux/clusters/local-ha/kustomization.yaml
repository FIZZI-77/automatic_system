apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flagger-namespace.yaml
  - flagger-repository.yaml
  - flagger-release.yaml
  - mesh-policies.yaml
  - mesh-ingress.yaml
  - applications-release.yaml

configMapGenerator:
  - name: applications-release-values
    namespace: flux-system
    files:
      - values.yaml=applications-values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

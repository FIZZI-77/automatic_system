apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automatic-system-mesh-policies
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/mesh/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: automatic-system
  targetNamespace: automatic-system
  timeout: 5m
  wait: true

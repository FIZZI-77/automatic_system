---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: asset-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-service
  template:
    metadata:
      labels:
        app: asset-service
        app.kubernetes.io/name: asset-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: automatic-system
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
      - name: asset-service
        image: automatic-system/asset:dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: telemetry-config
        ports:
        - name: grpc
          containerPort: 50065
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          grpc:
            port: 50065
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 2
        livenessProbe:
          grpc:
            port: 50065
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          grpc:
            port: 50065
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 45
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: ASSET_DATABASE_URL
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  revisionHistoryLimit: 3
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    appProtocol: http
    port: 8081
    targetPort: 8081
  type: ClusterIP

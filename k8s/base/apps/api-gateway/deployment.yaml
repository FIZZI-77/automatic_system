---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: automatic-system
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
      - name: api-gateway
        image: automatic-system/api-gateway:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        volumeMounts:
        - name: jwt-public
          mountPath: /app/keys/public.pem
          subPath: public.pem
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 45
        envFrom:
        - configMapRef:
            name: api-gateway-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: REDIS_PASSWORD
              optional: true
        - name: REPORT_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: REPORT_INTERNAL_TOKEN
      volumes:
      - name: jwt-public
        secret:
          secretName: jwt-public-key
          defaultMode: 292
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  revisionHistoryLimit: 3
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: automatic-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: automatic-system-otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: automatic-system-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: automatic-system-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: automatic-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: automatic-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: automatic-system-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: automatic-system-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: automatic-system-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: automatic-system

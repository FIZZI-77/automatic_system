apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686/observe/jaeger
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: elasticsearch
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: true
        customQuery: false
        tags:
          - key: service.name
            value: service.name
  - name: Elasticsearch Logs
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logs-automatic-system-*
    editable: false
    jsonData:
      timeField: '@timestamp'
      logMessageField: message
      logLevelField: log.level
  - name: ClickHouse Analytics
    uid: clickhouse-analytics
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: analytics
      defaultDatabase: analytics
      secure: false
      validateSql: true
      enableRowLimit: true
      rowLimit: 100000
      queryTimeout: 30
      customSettings:
        - setting: readonly
          value: "1"
        - setting: max_execution_time
          value: "30"
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD

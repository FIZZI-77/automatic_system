apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-metrics-agent-config
  namespace: automatic-system
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: etcd
              scrape_interval: 15s
              static_configs:
                - targets: [127.0.0.1:2381]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 96
        spike_limit_mib: 24
      transform/node:
        metric_statements:
          - context: datapoint
            statements:
              - 'set(attributes["etcd_node"], "${env:K8S_NODE_NAME}")'
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9465
        enable_open_metrics: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13134

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, transform/node, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: etcd-metrics-agent
  namespace: automatic-system
  labels:
    app: etcd-metrics-agent
    app.kubernetes.io/name: etcd-metrics-agent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: automatic-system
spec:
  selector:
    matchLabels:
      app: etcd-metrics-agent
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false"
        app: etcd-metrics-agent
        app.kubernetes.io/name: etcd-metrics-agent
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: [--config=/etc/otelcol-contrib/config.yaml]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9465
          readinessProbe:
            httpGet:
              path: /
              port: 13134
          livenessProbe:
            httpGet:
              path: /
              port: 13134
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: etcd-metrics-agent-config

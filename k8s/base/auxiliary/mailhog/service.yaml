---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/component: auxiliary
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: mailhog
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: ui
    port: 8025
    targetPort: 8025

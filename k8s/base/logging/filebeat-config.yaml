filebeat.inputs:
  - type: filestream
    id: kubernetes-container-logs
    compression: auto
    paths:
      - /var/log/pods/*/*/*.log*
    parsers:
      - container: ~
      - multiline:
          type: pattern
          pattern: '^[[:space:]]'
          negate: false
          match: after
    prospector.scanner.fingerprint.enabled: true
    prospector.scanner.exclude_files:
      - '^/var/log/pods/automatic-system_minio-[^/]+/minio/'
    file_identity.fingerprint: ~
  - type: filestream
    id: minio-container-logs-service-tagged
    compression: auto
    paths:
      - /var/log/pods/automatic-system_minio-*_*/minio/*.log*
    fields_under_root: true
    fields:
      service:
        name: minio
    parsers:
      - container: ~
      - multiline:
          type: pattern
          pattern: '^[[:space:]]'
          negate: false
          match: after
    prospector.scanner.fingerprint.enabled: true
    prospector.scanner.fingerprint.length: 256
    file_identity.fingerprint: ~

processors:
  - decode_json_fields:
      when.regexp.message: '^\s*\{'
      fields: [message]
      target: ""
      overwrite_keys: true
      expand_keys: true
      add_error_key: false
  - script:
      lang: javascript
      id: normalize_log_level
      source: >-
        function process(event) {
          var level = event.Get("log.level") || event.Get("level") || event.Get("severity") || event.Get("severity_text");
          var message = event.Get("message") || event.Get("msg") || "";

          if (event.Get("msg")) {
            event.Put("message", event.Get("msg"));
          }

          var service = event.Get("service");
          if (typeof service === "string") {
            event.Delete("service");
            event.Put("service.name", service);
          }

          var userAgent = event.Get("user_agent");
          if (typeof userAgent === "string") {
            event.Delete("user_agent");
            event.Put("user_agent.original", userAgent);
          }

          if (!level && message) {
            var text = String(message);
            var match = text.match(/^\s*(?:\S+\s+)?(debug|info|warn|warning|error|fatal|panic|dpanic|critical)\b/i);
            if (!match) {
              match = text.match(/^\s*(?:\[[^\]]+\]\s*)*\[(debug|info|warn|warning|error|fatal|panic|dpanic|critical)\]/i);
            }
            if (match) {
              level = match[1];
            }
          }

          level = String(level || "info").toLowerCase();
          if (level === "warning") {
            level = "warn";
          }
          if (level === "fatal" || level === "panic" || level === "dpanic" || level === "critical") {
            level = "error";
          }
          event.Put("log.level", level);
        }
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      default_indexers.enabled: false
      default_matchers.enabled: false
      indexers:
        - pod_uid:
      matchers:
        - logs_path:
            logs_path: /var/log/pods/
            resource_type: pod
  - add_fields:
      target: service
      fields:
        environment: local-ha
  - drop_event:
      when:
        and:
          - equals:
              log.level: info
          - or:
              - and:
                  - equals:
                      message: gRPC request completed
                  - regexp:
                      grpc_method: '^/grpc\.health\.v1\.Health/(?:Check|Watch)$'
                  - equals:
                      code: OK
              - and:
                  - regexp:
                      kubernetes.pod.name: '^brigade-service-primary-'
                  - regexp:
                      message: '^\[[^]]+\] "- - -" 0 - - - .* outbound\|9092\|\|kafka-[0-9]+\.automatic-system\.svc\.cluster\.local'
              - regexp:
                  message: '(?i)"POST /opentelemetry\.proto\.collector\.(?:trace|metrics|logs)\.v1\.[^/]+/Export HTTP/2" 2\d\d '
              - and:
                  - equals:
                      message: http request completed
                  - regexp:
                      path: '^/(?:health|healthz|livez|readyz|metrics)/?$'
                  - range:
                      status.gte: 200
                      status.lt: 400
              - regexp:
                  message: '(?i)"(?:GET|HEAD) /(?:health|healthz|livez|readyz|metrics)/?(?:\?[^ ]*)? HTTP/[12](?:\.[0-9])?" [23][0-9][0-9] '
              - and:
                  - regexp:
                      kubernetes.pod.name: '^filebeat-'
                  - regexp:
                      message: '(?i)non-zero metrics in the last'
  - drop_fields:
      ignore_missing: true
      fields: [agent.ephemeral_id, agent.id, ecs.version, host.mac, level, severity, severity_text, msg]

setup.template.name: logs-automatic-system
setup.template.pattern: logs-automatic-system-*
setup.ilm.enabled: false

output.elasticsearch:
  hosts: [http://elasticsearch:9200]
  index: logs-automatic-system-%{+yyyy.MM.dd}
  compression_level: 3
  worker: 2

logging.json: true
logging.level: info

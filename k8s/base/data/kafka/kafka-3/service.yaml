---
apiVersion: v1
kind: Service
metadata:
  name: kafka-3
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/instance: kafka-3
spec:

  publishNotReadyAddresses: true

  selector:
    app: kafka-3
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093

apiVersion: v1
kind: Service
metadata:
  name: redis-location-sentinel
  namespace: automatic-system
  labels:
    app: redis-location-sentinel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-location-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
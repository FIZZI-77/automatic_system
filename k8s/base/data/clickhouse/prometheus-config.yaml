apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-prometheus-config
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: analytics-store
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
data:
  prometheus.xml: |
    <clickhouse>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
        <errors>true</errors>
        <histograms>true</histograms>
      </prometheus>
    </clickhouse>

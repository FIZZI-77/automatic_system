---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: automatic-system
  labels:
    app.kubernetes.io/name: clickhouse-init
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: automatic-system
    app.kubernetes.io/managed-by: kustomize
    automatic-system.io/job-type: init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: clickhouse-init
        app.kubernetes.io/name: clickhouse-init
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: automatic-system
        app.kubernetes.io/managed-by: kustomize
    spec:
      restartPolicy: Never
      containers:
      - name: init
        image: automatic-system/analytics-clickhouse-init:dev
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        args:
        - exec clickhouse-client --host clickhouse --user analytics --password "$CLICKHOUSE_PASSWORD" --multiquery --queries-file
          /schema/001_events.sql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: runtime-secrets
              key: CLICKHOUSE_PASSWORD
      automountServiceAccountToken: false
      enableServiceLinks: false
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: notification-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: runtime-secrets
                key: NOTIFICATION_DATABASE_URL

          - name: SMTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: grafana-smtp
                key: smtp-user

          - name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-smtp
                key: smtp-password

          - name: SMTP_FROM
            valueFrom:
              secretKeyRef:
                name: grafana-smtp
                key: smtp-user

        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: notification-service-config

        {{- if .Values.applications.notification.fcm.enabled }}
        volumeMounts:
        - name: firebase-service-account
          mountPath: /var/run/secrets/firebase
          readOnly: true
        {{- end }}

        image: '{{ include "applications.image" (dict "root" $ "name" "notification") }}'
        imagePullPolicy: {{ default (index .Values.applications "notification").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50061
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: notification-service
        ports:
        - containerPort: 50061
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50061
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50061
          periodSeconds: 2
          timeoutSeconds: 1

      {{- if .Values.applications.notification.fcm.enabled }}
      volumes:
        - name: firebase-service-account
          secret:
            secretName: {{ .Values.applications.notification.fcm.serviceAccountSecretName }}
            items:
              - key: {{ .Values.applications.notification.fcm.serviceAccountKey }}
                path: service-account.json
      {{- end }}

      enableServiceLinks: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
---

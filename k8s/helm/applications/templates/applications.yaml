apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: automatic-system
  name: analytics-service
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "analytics").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: analytics-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: analytics-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: CLICKHOUSE_PASSWORD
              name: runtime-secrets
        envFrom:
        - configMapRef:
            name: telemetry-config
        image: '{{ include "applications.image" (dict "root" $ "name" "analytics") }}'
        imagePullPolicy: {{ default (index .Values.applications "analytics").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50063
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: analytics-service
        ports:
        - containerPort: 50063
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50063
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50063
          periodSeconds: 2
          timeoutSeconds: 1
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: automatic-system
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "api-gateway").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      {{- if .Values.apiGateway.topologySpread.enabled }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: {{ .Values.apiGateway.topologySpread.whenUnsatisfiable }}
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: api-gateway
      {{- end }}
      containers:
      - env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: runtime-secrets
              optional: true
        - name: REPORT_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              key: REPORT_INTERNAL_TOKEN
              name: runtime-secrets
        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: api-gateway-config
        image: '{{ include "applications.image" (dict "root" $ "name" "api-gateway") }}'
        imagePullPolicy: {{ default (index .Values.applications "api-gateway").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: api-gateway
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 45
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /app/keys/public.pem
          name: jwt-public
          readOnly: true
          subPath: public.pem
      enableServiceLinks: false
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: jwt-public
        secret:
          defaultMode: 292
          secretName: jwt-public-key

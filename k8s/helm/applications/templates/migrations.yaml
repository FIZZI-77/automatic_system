{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: job
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: migrator-asset
    app.kubernetes.io/part-of: automatic-system
    automatic-system.io/job-type: migration
  name: {{ printf "%s-asset-migrate-%d" .Release.Name .Release.Revision | trunc 63 | trimSuffix "-" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  namespace: {{ .Release.Namespace }}
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrator-asset
        sidecar.istio.io/inject: "false"
        app.kubernetes.io/component: job
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: migrator-asset
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -dir
        - /migrations
        - up
        env:
        - name: GOOSE_DRIVER
          value: postgres
        - name: GOOSE_DBSTRING
          valueFrom:
            secretKeyRef:
              key: ASSET_GOOSE_DBSTRING
              name: runtime-secrets
        image: '{{ .Values.migrations.registry }}/automatic-system-asset-migrator:{{ required "migrations.tag is required when migrations.enabled=true" .Values.migrations.tag }}'
        imagePullPolicy: {{ .Values.migrations.pullPolicy }}
        name: migrator
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 32Mi
      enableServiceLinks: false
      restartPolicy: Never
  ttlSecondsAfterFinished: 86400
---

apiVersion: v1
data:
  GRPC_PORT: "50059"
  PRESIGN_TTL: "15m"
  S3_BUCKET: "city-files"
  S3_ENDPOINT: "http://minio:9000"
  S3_PATH_STYLE: "true"
  S3_PUBLIC_ENDPOINT: "http://localhost:9000"
  S3_REGION: "us-east-1"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: automatic-system
  name: file-service-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: automatic-system
  name: file-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: grpc
    port: 50059
    targetPort: 50059
  selector:
    app: {{ ternary "file-service-primary" "file-service" .Values.canary.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: automatic-system
  name: file-service
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "file").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: file-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: file-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: file-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: FILE_DATABASE_URL
              name: runtime-secrets
        {{- if .Values.haDatabase.enabled }}
        - name: READ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: FILE_READ_DATABASE_URL
              name: runtime-secrets
        {{- end }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: S3_ACCESS_KEY
              name: runtime-secrets
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: S3_SECRET_KEY
              name: runtime-secrets
        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: file-service-config
        image: '{{ include "applications.image" (dict "root" $ "name" "file") }}'
        imagePullPolicy: {{ default (index .Values.applications "file").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50059
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: file-service
        ports:
        - containerPort: 50059
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50059
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50059
          periodSeconds: 2
          timeoutSeconds: 1
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

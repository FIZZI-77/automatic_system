apiVersion: v1
data:
  DB_HOST: {{ ternary .Values.haDatabase.platformPrimary "postgres-auth" .Values.haDatabase.enabled | quote }}
  DB_NAME: "auth_db"
  DB_PORT: {{ ternary .Values.haDatabase.port "5432" .Values.haDatabase.enabled | quote }}
  DB_READ_HOST: {{ ternary .Values.haDatabase.platformReplicas "postgres-auth" .Values.haDatabase.enabled | quote }}
  DB_USERNAME: "auth_user"
  FRONTEND_BASE_URL: "https://city.localhost"
  GRPC_PORT: "50051"
  JWT_KEY_ID: "local-dev-key"
  JWT_PRIVATE_KEY_PATH: "/app/keys/private.pem"
  KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  OUTBOX_WORKER_COUNT: "4"
  PROFILE_GRPC_ADDR: "profile-service:50055"
  SMTP_FROM_NAME: "Automatic System"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USE_STARTTLS: "true"
  SMTP_USE_TLS: "false"
  SSLMODE: "disable"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: automatic-system
  name: auth-service-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: automatic-system
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: {{ ternary "auth-service-primary" "auth-service" .Values.canary.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: automatic-system
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "auth").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: auth-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: AUTH_DB_PASSWORD
              name: runtime-secrets
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-smtp
              key: smtp-user

        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-smtp
              key: smtp-password
        - name: SMTP_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: grafana-smtp
              key: smtp-user
        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: auth-service-config
        image: '{{ include "applications.image" (dict "root" $ "name" "auth") }}'
        imagePullPolicy: {{ default (index .Values.applications "auth").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50051
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: auth-service
        ports:
        - containerPort: 50051
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50051
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50051
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /app/keys/private.pem
          name: jwt-private
          readOnly: true
          subPath: private.pem
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: jwt-private
        secret:
          defaultMode: 292
          secretName: jwt-private-key

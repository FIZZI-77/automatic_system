apiVersion: v1
data:
  DB_HOST: {{ ternary .Values.haDatabase.platformPrimary "postgres-brigade" .Values.haDatabase.enabled | quote }}
  DB_NAME: "brigade_db"
  DB_PORT: {{ ternary .Values.haDatabase.port "5432" .Values.haDatabase.enabled | quote }}
  DB_READ_HOST: {{ ternary .Values.haDatabase.platformReplicas "postgres-brigade" .Values.haDatabase.enabled | quote }}
  DB_USERNAME: "brigade_user"
  DEPARTMENT_GRPC_ADDR: "department-service:50053"
  GRPC_PORT: "50054"
  KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  KAFKA_ROUTING_TOPIC: "routing.events.v1"
  KAFKA_TICKET_TOPIC: "tickets.events.v1"
  OUTBOX_WORKER_COUNT: "4"
  PROFILE_CONSUMER_WORKER_COUNT: "4"
  PROFILE_GRPC_ADDR: "profile-service:50055"
  PROFILE_KAFKA_GROUP_ID: "brigade-profile-projection-v1"
  PROFILE_RETRY_WORKER_COUNT: "2"
  SSLMODE: "disable"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: brigade-service
    app.kubernetes.io/part-of: automatic-system
  name: brigade-service-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: brigade-service
    app.kubernetes.io/part-of: automatic-system
  name: brigade-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: grpc
    port: 50054
    targetPort: 50054
  selector:
    app: {{ ternary "brigade-service-primary" "brigade-service" .Values.canary.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: brigade-service
    app.kubernetes.io/part-of: automatic-system
  name: brigade-service
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "brigade").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: brigade-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "587"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: brigade-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: brigade-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: BRIGADE_DB_PASSWORD
              name: runtime-secrets
        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: brigade-service-config
        image: '{{ include "applications.image" (dict "root" $ "name" "brigade") }}'
        imagePullPolicy: {{ default (index .Values.applications "brigade").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50054
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: brigade-service
        ports:
        - containerPort: 50054
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50054
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50054
          periodSeconds: 2
          timeoutSeconds: 1
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

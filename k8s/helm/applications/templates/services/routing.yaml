apiVersion: v1
data:
  GRPC_PORT: "50057"
  KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  KAFKA_ROUTING_TOPIC: "routing.events.v1"
  KAFKA_TICKET_TOPIC: "tickets.events.v1"
  LOG_LEVEL: "info"
  OUTBOX_WORKER_COUNT: "4"
  SHUTDOWN_TIMEOUT: "20s"
  VALHALLA_TIMEOUT: "15s"
  VALHALLA_URL: "http://valhalla:8002"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: routing-service
    app.kubernetes.io/part-of: automatic-system
  name: routing-service-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: routing-service
    app.kubernetes.io/part-of: automatic-system
  name: routing-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: grpc
    port: 50057
    targetPort: 50057
  selector:
    app: {{ ternary "routing-service-primary" "routing-service" .Values.canary.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: routing-service
    app.kubernetes.io/part-of: automatic-system
  name: routing-service
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 3
  {{- if not .Values.applicationAutoscaling.enabled }}
  replicas: {{ (index .Values.applications "routing").replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: routing-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
      labels:
        app: routing-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: routing-service
        app.kubernetes.io/part-of: automatic-system
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: ROUTING_DATABASE_URL
              name: runtime-secrets
        {{- if .Values.haDatabase.enabled }}
        - name: READ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: ROUTING_READ_DATABASE_URL
              name: runtime-secrets
        {{- end }}
        envFrom:
        - configMapRef:
            name: telemetry-config
        - configMapRef:
            name: routing-service-config
        image: '{{ include "applications.image" (dict "root" $ "name" "routing") }}'
        imagePullPolicy: {{ default (index .Values.applications "routing").image.pullPolicy .Values.globalImage.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 50057
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
        name: routing-service
        ports:
        - containerPort: 50057
          name: grpc
        - containerPort: 9464
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 50057
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 45
          grpc:
            port: 50057
          periodSeconds: 2
          timeoutSeconds: 1
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45

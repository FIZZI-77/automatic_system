apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-gateway
  namespace: automatic-system
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      auth_basic "Automatic System Observability";
      auth_basic_user_file /etc/nginx/auth/htpasswd;
      client_max_body_size 16m;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;

      location = /healthz {
        auth_basic off;
        return 204;
      }

      location = /observe {
        return 308 /observe/;
      }
      location = /observe/ {
        try_files /index.html =404;
      }

      location = /observe/grafana { return 308 /observe/grafana/; }
      location /observe/grafana/ {
        proxy_pass http://grafana.automatic-system.svc.cluster.local:3000;
      }

      location = /observe/prometheus { return 308 /observe/prometheus/; }
      location /observe/prometheus/ {
        proxy_pass http://prometheus.automatic-system.svc.cluster.local:9090/;
      }

      location = /observe/jaeger { return 308 /observe/jaeger/; }
      location /observe/jaeger/ {
        proxy_pass http://jaeger.automatic-system.svc.cluster.local:16686;
      }

      location = /observe/kibana { return 308 /observe/kibana/; }
      location /observe/kibana/ {
        proxy_pass http://kibana.automatic-system.svc.cluster.local:5601;
      }

      location = /observe/kiali { return 308 /observe/kiali/; }
      location /observe/kiali/ {
        proxy_pass http://kiali.istio-system.svc.cluster.local:20001;
      }

      location /observe/ {
        return 404;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="ru">
      <head><meta charset="utf-8"><title>Observability</title></head>
      <body>
        <h1>Observability</h1>
        <ul>
          <li><a href="/observe/grafana/">Grafana</a></li>
          <li><a href="/observe/prometheus/">Prometheus</a></li>
          <li><a href="/observe/jaeger/">Jaeger</a></li>
          <li><a href="/observe/kibana/">Kibana</a></li>
          <li><a href="/observe/kiali/">Kiali</a></li>
        </ul>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-gateway
  namespace: automatic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-gateway
  template:
    metadata:
      labels:
        app: observability-gateway
        sidecar.istio.io/inject: "true"
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.4-trixie
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: observability-gateway
        - name: auth
          secret:
            secretName: observability-basic-auth
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: observability-gateway
  namespace: automatic-system
spec:
  selector:
    app: observability-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -ticket-replicas
resources:
  - ../base
patches:
  - target:
      kind: Deployment
      name: pgbouncer
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: ticket-replicas
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: ticket-replicas
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchLabels/app.kubernetes.io~1instance
        value: ticket-replicas
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: ticket
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: postgres-ticket-replicas
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: ticket_db
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: ticket_user
      - op: replace
        path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
        value: TICKET_DB_PASSWORD
      - op: replace
        path: /spec/template/spec/containers/1/env/0/value
        value: ticket_user
      - op: replace
        path: /spec/template/spec/containers/1/env/1/valueFrom/secretKeyRef/key
        value: TICKET_DB_PASSWORD
  - target:
      kind: Service
      name: pgbouncer
    patch: |-
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: ticket-replicas

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-ticket-citus
  namespace: automatic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-ticket-citus
  namespace: automatic-system
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-ticket-citus
  namespace: automatic-system
subjects:
  - kind: ServiceAccount
    name: postgres-ticket-citus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-ticket-citus

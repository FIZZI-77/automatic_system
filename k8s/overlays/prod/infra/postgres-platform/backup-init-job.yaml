apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-platform-backup-init
  namespace: automatic-system
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: postgres-platform
      restartPolicy: OnFailure
      automountServiceAccountToken: true
      containers:
        - name: initialize
          image: bitnami/kubectl:1.33
          command:
            - /bin/sh
            - -ec
            - |
              until pod="$(kubectl get pods -n automatic-system -l cluster-name=postgres-platform,role=primary -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)" \
                && test -n "$pod" \
                && kubectl exec -n automatic-system "$pod" -- /bin/sh -ec '
                pgbackrest --stanza=platform --force stop || true
                pgbackrest --stanza=platform start
                pgbackrest --stanza=platform stanza-create
              '; do
                sleep 10
              done
              kubectl exec -n automatic-system "$pod" -- pgbackrest --stanza=platform check
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

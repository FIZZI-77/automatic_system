apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backup-bucket-init
  namespace: automatic-system
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: minio-client
          image: minio/mc:RELEASE.2025-05-21T01-59-54Z
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 2; done
              mc mb --ignore-existing local/postgres-backups
              mc version enable local/postgres-backups
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-gateway
  namespace: automatic-system
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-and-backend-to-backend
  namespace: automatic-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - {protocol: TCP, port: 50051}
        - {protocol: TCP, port: 50052}
        - {protocol: TCP, port: 50053}
        - {protocol: TCP, port: 50054}
        - {protocol: TCP, port: 50055}
        - {protocol: TCP, port: 50056}
        - {protocol: TCP, port: 50057}
        - {protocol: TCP, port: 50058}
        - {protocol: TCP, port: 50059}
        - {protocol: TCP, port: 50060}
        - {protocol: TCP, port: 50061}
        - {protocol: TCP, port: 50062}
        - {protocol: TCP, port: 50063}
        - {protocol: TCP, port: 50064}
        - {protocol: TCP, port: 50065}
        - {protocol: TCP, port: 8084}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-clients
  namespace: automatic-system
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [database, database-pooler]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, job, database-pooler]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-kafka
  namespace: automatic-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, job, messaging]
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-report-and-file-to-minio
  namespace: automatic-system
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [file-service, report-service]
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cache-clients
  namespace: automatic-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api-gateway, notification-service, location-service, redis-location-master, redis-location-replica-1, redis-location-replica-2, redis-location-sentinel]
      ports:
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 26379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: automatic-system
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [database, messaging, cache, object-storage, job]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: automatic-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-egress
  namespace: automatic-system
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [gateway, backend, frontend]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 587}

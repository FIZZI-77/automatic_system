apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrapes
  namespace: automatic-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 8008}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9100}
        - {protocol: TCP, port: 9121}
        - {protocol: TCP, port: 9127}
        - {protocol: TCP, port: 9187}
        - {protocol: TCP, port: 9308}
        - {protocol: TCP, port: 9363}
        - {protocol: TCP, port: 9464}
        - {protocol: TCP, port: 9465}
        - {protocol: TCP, port: 15020}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-exporters-to-infrastructure
  namespace: automatic-system
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [redis, kafka]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [redis-exporter, kafka-exporter]
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: automatic-system
spec:
  template:
    spec:
      containers:
        - name: location-service
          env:
            - name: READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: LOCATION_READ_DATABASE_URL
---

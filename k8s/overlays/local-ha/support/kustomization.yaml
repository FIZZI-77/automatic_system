apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automatic-system
resources:
  - ../../../base/data/redis/gateway
  - ../../../base/data/redis/notification
  - ../../../base/data/redis/location
  - ../../../base/data/kafka/kafka-1
  - ../../../base/data/kafka/kafka-2
  - ../../../base/data/kafka/kafka-3
  - ../../../base/data/clickhouse
  - ../../../base/data/valhalla
  - ../../../base/auxiliary
labels:
  - pairs:
      app.kubernetes.io/environment: local-ha
    includeSelectors: false
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: app.kubernetes.io/name=kafka
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: app.kubernetes.io/name=redis
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: clickhouse
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
